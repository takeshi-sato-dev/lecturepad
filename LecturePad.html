<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LecturePad">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>LecturePad</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@400;700&family=M+PLUS+Rounded+1c:wght@400;700&family=Zen+Maru+Gothic:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Source+Code+Pro:wght@400;600&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#101014;--sf:#1c1c22;--sf2:#27272f;--sf3:#32323c;--ac:#3b9eff;--ach:#5eb4ff;--tx:#d8d8e4;--txd:#6e6e88;--dng:#f04848;--ok:#3dcf6e;--rad:6px}
  body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--tx);height:100vh;display:flex;flex-direction:column;overflow:hidden;user-select:none}

  .tab-bar{display:flex;background:var(--bg);border-bottom:1px solid #222;overflow-x:auto;flex-shrink:0;min-height:32px;align-items:end;padding:0 8px;gap:2px}
  .tab{display:flex;align-items:center;gap:5px;padding:5px 14px;font-size:11px;letter-spacing:.3px;color:var(--txd);background:transparent;border:none;border-radius:var(--rad) var(--rad) 0 0;cursor:pointer;white-space:nowrap;font-family:inherit;transition:all .15s;text-transform:uppercase}
  .tab:hover{background:var(--sf);color:var(--tx)}
  .tab.active{background:var(--sf);color:var(--ac);font-weight:600}
  .tab .x,.tab .pop{width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;opacity:.3;transition:all .15s}
  .tab .x:hover{opacity:1;background:var(--dng);color:#fff}
  .tab .pop:hover{opacity:1;background:var(--ac);color:#fff}
  .tab-add{background:none;border:none;color:var(--txd);font-size:11px;cursor:pointer;padding:5px 10px;border-radius:var(--rad) var(--rad) 0 0;font-family:inherit;letter-spacing:.3px}
  .tab-add:hover{color:var(--tx);background:var(--sf)}

  .toolbar{min-height:42px;background:var(--sf);border-bottom:1px solid #1a1a20;display:flex;align-items:center;padding:0 8px;gap:4px;flex-shrink:0;flex-wrap:wrap}
  .toolbar.sub{min-height:34px;background:var(--sf2);border-bottom:1px solid #1f1f28;padding:3px 8px}
  .sep{width:1px;height:22px;background:#333;margin:0 3px}
  .b{height:30px;min-width:30px;padding:0 8px;border:none;border-radius:var(--rad);background:transparent;color:var(--txd);font-family:inherit;font-size:11px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;transition:all .12s;white-space:nowrap;letter-spacing:.2px}
  .b:hover{background:var(--sf2);color:var(--tx)} .b.on{background:var(--ac);color:#fff} .b.dng:hover{background:var(--dng);color:#fff}
  .b svg{width:15px;height:15px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2}
  .sel{height:26px;padding:0 5px;background:var(--sf3);color:var(--tx);border:1px solid #3a3a44;border-radius:5px;font-family:inherit;font-size:11px;cursor:pointer;outline:none}
  .num{width:46px;height:26px;padding:0 4px;background:var(--sf3);color:var(--tx);border:1px solid #3a3a44;border-radius:5px;font-family:inherit;font-size:11px;text-align:center;outline:none}
  .sg{display:flex;align-items:center;gap:3px}
  .sg label{font-size:10px;color:var(--txd);min-width:12px;text-align:right}
  input[type=range]{-webkit-appearance:none;width:50px;height:3px;background:var(--sf3);border-radius:2px;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--ac);cursor:pointer}
  .cr{display:flex;gap:3px;align-items:center}
  .cs{width:17px;height:17px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:all .12s}
  .cs:hover{transform:scale(1.2)} .cs.on{border-color:var(--tx)}

  .canvas-area{flex:1;overflow:auto;background:#0a0a0e;padding:20px}
  .canvas-wrap{position:relative;box-shadow:0 2px 24px rgba(0,0,0,.6);margin:0 auto;width:fit-content;border-radius:2px;overflow:hidden}
  #pdfCanvas,#drawCanvas{display:block;position:absolute;top:0;left:0}
  #pdfCanvas{position:relative} #drawCanvas{cursor:crosshair;touch-action:none}

  .pbar{height:34px;background:var(--sf);border-top:1px solid #1a1a20;display:flex;align-items:center;justify-content:center;gap:8px;flex-shrink:0}
  .pbar button{background:var(--sf2);border:none;color:var(--tx);width:28px;height:24px;border-radius:5px;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center}
  .pbar button:hover{background:var(--ac)} .pbar button:disabled{opacity:.25;cursor:default} .pbar button:disabled:hover{background:var(--sf2)}
  .pbar span{font-size:11px;color:var(--txd);min-width:100px;text-align:center;letter-spacing:.5px}

  .welcome{text-align:center;color:var(--txd);padding-top:18vh}
  .welcome h2{font-size:28px;font-weight:700;color:var(--tx);margin-bottom:4px;letter-spacing:-0.5px}
  .welcome p{font-size:13px;margin-bottom:20px;color:var(--txd)}
  .wbtn{display:inline-flex;align-items:center;gap:7px;padding:10px 22px;color:#fff;border:none;border-radius:var(--rad);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;margin:0 5px;transition:opacity .15s;letter-spacing:.3px}
  .wbtn:hover{opacity:.85}

  .tov{position:absolute;z-index:200;display:none}
  .tov .ta-ce{min-width:220px;min-height:36px;padding:6px 8px;font-size:20px;border:2px solid var(--ac);background:#fff;color:#111;outline:none;resize:both;overflow:auto;caret-color:#111;border-radius:4px;box-shadow:0 2px 16px rgba(0,0,0,.3);line-height:1.3;white-space:pre-wrap;word-break:break-word}
  .tov .ta-ce::-webkit-resizer{background:var(--ac);border-radius:2px}

  #fileInput{display:none}
  .zi{font-size:10px;color:var(--txd);min-width:30px;text-align:center}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
  .rev-box{display:flex;align-items:flex-start;gap:4px;flex-shrink:0}
  .rev-box textarea{flex:1;min-height:26px;padding:3px 6px;font-size:11px;background:var(--sf3);color:var(--tx);border:1px solid #3a3a44;border-radius:4px;font-family:inherit;outline:none;resize:vertical;line-height:1.4}
  .rev-box textarea:focus{border-color:var(--ac)}
  .rev-box.sel textarea{border-color:var(--ac);background:#1a2a3a}
  .rev-box.done textarea{color:var(--txd);text-decoration:line-through}
  .rev-box .tag{font-size:9px;color:var(--txd);min-width:14px;text-align:center}
  .rev-box .rbtn{width:18px;height:18px;border:none;background:transparent;color:var(--txd);cursor:pointer;font-size:11px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0}
  .rev-box .rbtn:hover{background:var(--sf2);color:var(--tx)}
</style>
</head>
<body>

  <button class="tab-add" id="tabAddWB">+ BOARD</button>
  <button class="tab-add" id="tabNewWin" title="Open new window" style="margin-left:auto">⧉ New Window</button>
  <button class="tab-add" id="tabReset" title="Clear saved sessions" style="opacity:.4;font-size:10px">Reset</button>
</div>

<div class="toolbar">
  <button class="b" id="btnOpen"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>Open</button>
  <button class="b" id="btnSave"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Export PDF</button>
  <div class="sep"></div>
  <button class="b" id="btnSaveSession" style="font-size:10px" title="Save session to file">💾 Session</button>
  <button class="b" id="btnLoadSession" style="font-size:10px" title="Load session from file">📂 Session</button>
  <div class="sep"></div>
  <button class="b on" id="btnSelect" title="Select (V)">⇱ Select</button>
  <button class="b" id="btnPen">Pen</button>
  <button class="b" id="btnLaser">Pointer</button>
  <button class="b" id="btnText">Text</button>
  <button class="b" id="btnReveal" title="Reveal mode (R)">Type</button>
  <button class="b" id="btnEraser">Eraser</button>
  <div class="sep"></div>
  <button class="b" id="btnLine" title="Line (Shift+L)">╱</button>
  <button class="b" id="btnArrow" title="Arrow (A)">→</button>
  <button class="b" id="btnCircle" title="Circle (C)">○</button>
  <button class="b" id="btnEllipse" title="Ellipse">⬭</button>
  <button class="b" id="btnRect" title="Rectangle">▭</button>
  <button class="b" id="btnRRect" title="Rounded Rectangle">▢</button>
  <button class="b" id="btnImg" title="Insert image">🖼</button>
  <input type="file" id="imgInput" accept="image/*" style="display:none">
  <div class="sep"></div>
  <div class="cr" id="colorRow"></div>
  <div class="sep"></div>
  <div class="sg"><input type="number" id="szN" class="num" value="3" min="1" max="20" style="width:36px"><input type="range" id="szR" min="1" max="20" value="3"></div>
  <div class="sg"><label>α</label><input type="range" id="alR" min="10" max="100" value="100"><input type="number" id="alN" class="num" value="1.0" min="0.1" max="1.0" step="0.1" style="width:40px"></div>
  <div class="sg" id="fadeG" style="display:none"><label>Fade</label><input type="range" id="fdR" min="5" max="60" value="20"><input type="number" id="fdN" class="num" value="2.0" min="0.5" max="6.0" step="0.1" style="width:42px"></div>
  <div class="sep"></div>
  <button class="b" id="btnUndo">↩ Undo</button>
  <button class="b" id="btnRedo">↪ Redo</button>
  <button class="b dng" id="btnClear">Clear page</button>
  <button class="b dng" id="btnClearAll">Clear all</button>
  <div style="flex:1"></div>
  <button class="b" id="btnPresent" style="background:var(--ok);color:#fff">⛶ Present</button>
  <div class="sep"></div>
  <button class="b" id="btnGrid" title="Toggle grid">Grid</button>
  <select id="boardSize" class="sel" style="font-size:10px" title="Board size">
    <option value="4:3">4:3</option>
    <option value="16:9">16:9</option>
    <option value="A4" selected>A4</option>
    <option value="A4L">A4 Landscape</option>
    <option value="Letter">Letter</option>
    <option value="LetterL">Letter Landscape</option>
  </select>
  <div class="sep"></div>
  <button class="b" id="btnZO">−</button><span class="zi" id="zI">100%</span><button class="b" id="btnZI">+</button>
  <div class="sg" id="scaleG" style="display:none"><div class="sep"></div><label style="font-size:10px">Scale</label><input type="range" id="scaleR" min="25" max="400" value="100" style="width:70px"><input type="number" id="scaleN" class="num" value="100" min="25" max="400" step="5" style="width:42px"><label style="font-size:10px">%</label></div>
  <button class="b" id="btnLock" style="display:none;font-size:12px" title="Lock/Unlock selected">🔒</button>
</div>

<div class="toolbar sub" id="textBar" style="display:none">
  <label style="font-size:10px;color:var(--txd)">Font</label>
  <select id="fSel" class="sel">
    <optgroup label="Sans-serif">
    <option value="'IBM Plex Sans',sans-serif">IBM Plex Sans</option>
    <option value="'Gill Sans','Gill Sans MT',sans-serif">Gill Sans</option>
    <option value="Helvetica,'Helvetica Neue',sans-serif">Helvetica</option>
    <option value="'Avenir Next','Avenir',sans-serif">Avenir Next</option>
    <option value="Futura,'Trebuchet MS',sans-serif">Futura</option>
    </optgroup>
    <optgroup label="Serif">
    <option value="'Playfair Display',serif">Playfair Display</option>
    <option value="Georgia,serif">Georgia</option>
    <option value="'Times New Roman',serif">Times New Roman</option>
    </optgroup>
    <optgroup label="Mono">
    <option value="'Source Code Pro',monospace">Source Code Pro</option>
    <option value="'Courier New',monospace">Courier New</option>
    </optgroup>
    <optgroup label="Japanese">
    <option value="'Noto Sans JP',sans-serif">Noto Sans JP</option>
    <option value="'Noto Serif JP',serif">Noto Serif JP</option>
    <option value="'M PLUS Rounded 1c',sans-serif">M PLUS Rounded</option>
    <option value="'Zen Maru Gothic',sans-serif">Zen Maru Gothic</option>
    <option value="'Hiragino Mincho ProN',serif">Hiragino Mincho</option>
    <option value="'Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif">Hiragino Sans</option>
    </optgroup>
  </select>
  <div class="sep"></div>
  <label style="font-size:10px;color:var(--txd)">Size</label>
  <input type="number" id="fSize" class="num" value="24" min="8" max="120" step="2">
  <label style="font-size:10px;color:var(--txd)">LH</label>
  <input type="number" id="fLH" class="num" value="1.25" min="0.8" max="3.0" step="0.05" style="width:46px" title="Line height">
  <div class="sep"></div>
  <button class="b" id="btnB" style="font-weight:900;font-size:13px;min-width:26px">B</button>
  <button class="b" id="btnI" style="font-style:italic;font-size:13px;min-width:26px">I</button>
  <div class="sep"></div>
  <button class="b" id="btnTAL" title="Left" style="min-width:22px;font-size:10px">≡←</button>
  <button class="b" id="btnTAC" title="Center" style="min-width:22px;font-size:10px">≡</button>
  <button class="b" id="btnTAR" title="Right" style="min-width:22px;font-size:10px">→≡</button>
  <button class="b on" id="btnTAJ" title="Justify" style="min-width:22px;font-size:10px">⊞</button>
</div>

<div id="revealBar" style="display:none"></div>

<div class="canvas-area">
  <div class="welcome" id="welcome">
    <h2>LecturePad</h2>
    <p>Open a PDF or start with a blank board</p>
    <button class="wbtn" id="wOpen" style="background:var(--ac)">Open PDF</button>
    <button class="wbtn" id="wBlank" style="background:var(--ok)">New Board</button>
  </div>
  <div class="canvas-wrap" id="canvasWrap" style="display:none">
    <canvas id="pdfCanvas"></canvas>
    <canvas id="drawCanvas"></canvas>

    <div id="revCursor" style="position:absolute;pointer-events:none;z-index:160;display:none">
      <div style="width:2px;height:28px;background:var(--ac);animation:blink 1s step-end infinite"></div>
    </div>
  </div>
</div>

<div class="pbar" id="pbar" style="display:none">
  <button id="pgF">⇤</button><button id="pgP">◀</button>
  <span id="pgI">1 / 1</span>
  <button id="pgN">▶</button><button id="pgL">⇥</button>
  <div style="width:1px;height:16px;background:#333"></div>
  <button id="pgA" style="font-size:14px" title="Add page">＋</button>
</div>
<input type="file" id="fileInput" accept="application/pdf">

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const pC=$('#pdfCanvas'),dC=$('#drawCanvas'),pX=pC.getContext('2d'),dX=dC.getContext('2d');
let WB_W=794,WB_H=1123;const MIN_STROKE=6;
const BOARD_SIZES={'4:3':[1280,960],'16:9':[1280,720],'A4':[794,1123],'A4L':[1123,794],'Letter':[816,1056],'LetterL':[1056,816]};

/* ── Tabs ── */
let tabs=[],activeTab=null,tabId=0;
function newTab(type,name,pdf,pdfData){
  const t={id:++tabId,type,name,pdf:pdf||null,pdfData:pdfData||null,
    annotations:{},undoStack:{},redoStack:{},currentPage:1,totalPages:type==='whiteboard'?1:0,
    typeBoxes:[{text:'',status:'ready'}],
    prompt:{text:'',size:20,bg:'#000000',fg:'#ffffff',alpha:0.75,align:'left',show:false,lh:1.3}};
  if(pdf) t.totalPages=pdf.numPages;
  tabs.push(t);renderTabs();switchTab(t.id);autoSave();return t;
}
function switchTab(id){
  if(activeTab) saveToTab(activeTab);
  activeTab=id;const t=tabs.find(x=>x.id===id);if(!t)return;
  S.annotations=t.annotations;S.undoStack=t.undoStack;S.redoStack=t.redoStack;S.currentPage=t.currentPage;S.totalPages=t.totalPages;
  S.pdf=t.pdf;S.pdfData=t.pdfData;S.workspace=t.type;S.laserStrokes=[];S.editIdx=-1;hideTO();
  // Restore Type boxes for this tab
  REV.boxes=[];REV.selIdx=-1;REV.active=false;REV.autoTimer=null;
  if(t.typeBoxes&&t.typeBoxes.length){
    t.typeBoxes.forEach(b=>REV.boxes.push({text:b.text||'',status:b.status||'ready'}));
  } else {
    REV.boxes.push({text:'',status:'ready'});
  }
  REV._statusText='Select a box, click canvas';
  renderRevBoxes();
  // Restore Prompt for this tab
  if(t.prompt){
    S.promptText=t.prompt.text||'';S.promptSize=t.prompt.size||20;
    S.promptBg=t.prompt.bg||'#000000';S.promptFg=t.prompt.fg||'#ffffff';
    S.promptAlpha=t.prompt.alpha!==undefined?t.prompt.alpha:0.75;
    S.promptAlign=t.prompt.align||'left';S.showPrompt=!!t.prompt.show;S.promptLH=t.prompt.lh||1.3;
  } else {
    S.promptText='';S.promptSize=20;S.promptBg='#000000';S.promptFg='#ffffff';
    S.promptAlpha=0.75;S.promptAlign='left';S.showPrompt=false;S.promptLH=1.3;
  }
  S.promptScreenX=null;S.promptScreenY=null;
  // Sync Type popup if open
  if(typeWin&&!typeWin.closed&&typeWin.syncFromMain) typeWin.syncFromMain();
  renderTabs();$('#welcome').style.display='none';$('#canvasWrap').style.display='block';$('#pbar').style.display='flex';
  renderPage();
}
function saveToTab(id){
  const t=tabs.find(x=>x.id===id);if(!t)return;
  t.annotations=S.annotations;t.undoStack=S.undoStack;t.redoStack=S.redoStack;
  t.currentPage=S.currentPage;t.totalPages=S.totalPages;
  // Save Type boxes and Prompt per tab
  t.typeBoxes=REV.boxes.map(b=>({text:b.text,status:'ready'}));
  t.prompt={text:S.promptText,size:S.promptSize,bg:S.promptBg,fg:S.promptFg,alpha:S.promptAlpha,align:S.promptAlign,show:S.showPrompt,lh:S.promptLH};
}
function closeTab(id){
  tabs=tabs.filter(x=>x.id!==id);
  if(tabs.length===0){
    activeTab=null;renderTabs();
    $('#canvasWrap').style.display='none';$('#pbar').style.display='none';$('#welcome').style.display='';
    autoSave();return;
  }
  if(activeTab===id){activeTab=null;switchTab(tabs[tabs.length-1].id);}
  renderTabs();autoSave();
}
function renderTabs(){
  const bar=$('#tabBar');bar.querySelectorAll('.tab').forEach(e=>e.remove());const btn=$('#tabAddWB');
  tabs.forEach((t,ti)=>{
    const el=document.createElement('button');el.className='tab'+(t.id===activeTab?' active':'');
    el.draggable=true;el.dataset.idx=ti;
    const nameSpan=document.createElement('span');nameSpan.className='tname';nameSpan.textContent=(t.type==='pdf'?'📄 ':'◻ ')+t.name;
    el.appendChild(nameSpan);
    el.insertAdjacentHTML('beforeend',' <span class="pop" title="Pop out to window">⧉</span> <span class="x">×</span>');
    let clickTimer=null;
    el.onclick=e=>{
      if(e.target.classList.contains('x')){closeTab(t.id);e.stopPropagation();return;}
      if(e.target.classList.contains('pop')){popOutTab(t.id);e.stopPropagation();return;}
      if(clickTimer){clearTimeout(clickTimer);clickTimer=null;return;}
      clickTimer=setTimeout(()=>{clickTimer=null;switchTab(t.id);},250);
    };
    nameSpan.addEventListener('dblclick',e=>{
      e.stopPropagation();
      if(clickTimer){clearTimeout(clickTimer);clickTimer=null;}
      if(t.id!==activeTab) switchTab(t.id);
      const inp=document.createElement('input');inp.type='text';inp.value=t.name;
      inp.style.cssText='width:80px;height:18px;font-size:11px;background:#1e1e2e;color:#cdd6f4;border:1px solid #89b4fa;border-radius:3px;padding:0 4px;outline:none';
      nameSpan.textContent='';nameSpan.appendChild(inp);inp.focus();inp.select();
      const finish=()=>{
        const v=inp.value.trim();if(v) t.name=v;
        renderTabs();autoSave();
      };
      inp.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();finish();}if(ev.key==='Escape'){renderTabs();}ev.stopPropagation();});
      inp.addEventListener('blur',finish);
    });
    // Drag reorder
    el.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',ti);el.style.opacity='0.4';});
    el.addEventListener('dragend',()=>{el.style.opacity='1';});
    el.addEventListener('dragover',e=>{e.preventDefault();el.style.borderLeft='2px solid #89b4fa';});
    el.addEventListener('dragleave',()=>{el.style.borderLeft='';});
    el.addEventListener('drop',e=>{

async function popOutTab(id){
  if(activeTab===id) saveToTab(id);
  const t=tabs.find(x=>x.id===id); if(!t) return;
  // Serialize state
  const state={type:t.type, name:t.name, annotations:t.annotations, undoStack:t.undoStack, redoStack:t.redoStack,
    currentPage:t.currentPage, totalPages:t.totalPages};
  // Open new window with same app
  const w=window.open('','','width=1200,height=800');
  if(!w){alert('Pop-up blocked. Please allow pop-ups for this page.');return;}
  // Write the full app HTML into the new window
  const html=document.documentElement.outerHTML;
  w.document.open();w.document.write(html);w.document.close();
  // Transfer data after new window loads
  const transfer=()=>{
    try{
      // Create a tab in the new window with our data
      if(t.pdfData){
        const blob=new Blob([t.pdfData],{type:'application/pdf'});
        const reader=new FileReader();
        reader.onload=()=>{
          w.postMessage({action:'loadTab',state,pdfBase64:reader.result},'*');
        };
        reader.readAsDataURL(blob);
      } else {
        w.postMessage({action:'loadTab',state,pdfBase64:null},'*');
      }
      // Keep original tab — pop-out is a copy
    }catch(e){console.error(e);}
  };
  setTimeout(transfer,1500); // wait for scripts to load
}

// Receive tab data from parent window
window.addEventListener('message',async e=>{

  const{state,pdfBase64}=e.data;

});

function updateSelectTextBar(){

  $('#scaleR').value=100;$('#scaleN').value=100;

function applyFontToSelected(){
  if(S.tool!=='select'||S.selectSet.size===0) return false;

    }

  return changed;
}

      a.points=orig.points.map(p=>({x:cx+(p.x-cx)*ratio,y:cy+(p.y-cy)*ratio}));
      a.lineWidth=orig.lineWidth*ratio;
    }
    if(orig.type==='shape'){
      const cx=(orig.x1+orig.x2)/2,cy=(orig.y1+orig.y2)/2;
      a.x1=cx+(orig.x1-cx)*ratio;a.y1=cy+(orig.y1-cy)*ratio;
      a.x2=cx+(orig.x2-cx)*ratio;a.y2=cy+(orig.y2-cy)*ratio;
      a.lineWidth=orig.lineWidth*ratio;
    }

  });

}

/* ── Rich Text Helpers ── */
// Save/restore selection for contentEditable
let _savedRange=null;
function saveSelection(){
  const sel=window.getSelection();
  if(sel.rangeCount>0&&ta.contains(sel.anchorNode)){
    _savedRange=sel.getRangeAt(0).cloneRange();
  }
}
function restoreSelection(){
  if(_savedRange){
    const sel=window.getSelection();
    sel.removeAllRanges();sel.addRange(_savedRange);
  }
}
// Track selection changes while editing
document.addEventListener('selectionchange',()=>{
  if(tov.style.display!=='block') return;
  const sel=window.getSelection();
  if(sel.rangeCount>0&&ta.contains(sel.anchorNode)){
    _savedRange=sel.getRangeAt(0).cloneRange();
  }
});
// Ensure annotation has runs array (backward compat)
function ensureRuns(a){
  if(a.runs) return;
  a.runs=[{text:a.text||'',color:a.color||'#1a1a1a',bold:!!a.bold,italic:!!a.italic}];
  delete a.text;delete a.color;delete a.bold;delete a.italic;
}
// Get plain text from runs
function runsToText(runs){return runs.map(r=>r.text).join('');}
// Populate contentEditable div from runs array
function runsToDOM(div,runs,font,fontSize){
  div.innerHTML='';
  const text=runsToText(runs);
  if(!text){return;}
  const allChars=[];
  for(const r of runs){
    for(let i=0;i<r.text.length;i++){
      allChars.push({ch:r.text[i],color:r.color,bold:r.bold,italic:r.italic});
    }
  }
  // Build spans grouped by formatting
  let cur=null;
  for(const c of allChars){
    if(c.ch==='\n'){
      if(cur){div.appendChild(makeSpan(cur));cur=null;}
      div.appendChild(document.createElement('br'));
      continue;
    }
    if(!cur||cur.color!==c.color||cur.bold!==c.bold||cur.italic!==c.italic){
      if(cur) div.appendChild(makeSpan(cur));
      cur={text:'',color:c.color,bold:c.bold,italic:c.italic};
    }
    cur.text+=c.ch;
  }
  if(cur) div.appendChild(makeSpan(cur));
}
function makeSpan(run){
  const sp=document.createElement('span');
  sp.textContent=run.text;
  sp.style.color=run.color;
  sp.style.fontWeight=run.bold?'bold':'normal';
  sp.style.fontStyle=run.italic?'italic':'normal';
  return sp;
}
// Extract runs array from contentEditable div DOM
function domToRuns(div){
  const runs=[];
  function getStyle(node){
    let color=null,bold=null,italic=null;
    let el=node.nodeType===3?node.parentElement:node;
    while(el&&el!==div){
      // Check tag-based formatting (from execCommand)
      const tag=el.tagName;
      if((tag==='B'||tag==='STRONG')&&bold===null) bold=true;
      if((tag==='I'||tag==='EM')&&italic===null) italic=true;
      if(tag==='FONT'&&color===null){
        const fc=el.getAttribute('color');
        if(fc) color=fc;
      }
      // Check inline style (only if not already set by inner element)
      const cs=el.style;
      if(cs&&cs.color&&color===null) color=cs.color;
      if(cs&&(cs.fontWeight==='bold'||cs.fontWeight==='700')&&bold===null) bold=true;
      else if(cs&&(cs.fontWeight==='normal'||cs.fontWeight==='400')&&bold===null) bold=false;
      if(cs&&cs.fontStyle==='italic'&&italic===null) italic=true;
      else if(cs&&cs.fontStyle==='normal'&&italic===null) italic=false;
      el=el.parentElement;
    }
    // Fall back to defaults
    if(color===null) color=S.color;
    if(bold===null) bold=S.textBold;
    if(italic===null) italic=S.textItalic;
    color=normalizeColor(color);
    return{color,bold,italic};
  }
  function walk(node){
    if(node.nodeType===3){
      const text=node.textContent;
      if(!text) return;
      const st=getStyle(node);
      // Merge with last run if same style
      const last=runs[runs.length-1];
      if(last&&last.color===st.color&&last.bold===st.bold&&last.italic===st.italic){
        last.text+=text;
      }else{
        runs.push({text,color:st.color,bold:st.bold,italic:st.italic});
      }
      return;
    }
    if(node.nodeName==='BR'){
      const last=runs[runs.length-1];
      if(last) last.text+='\n';
      else runs.push({text:'\n',color:S.color,bold:S.textBold,italic:S.textItalic});
      return;
    }
    if(node.nodeName==='DIV'||node.nodeName==='P'){
      // Block element = newline (unless it's the first child)
      if(runs.length>0){
        const last=runs[runs.length-1];
        if(last.text&&!last.text.endsWith('\n')) last.text+='\n';
      }
    }
    for(const ch of node.childNodes) walk(ch);
  }
  walk(div);
  // Clean up trailing newlines from block-level divs
  if(runs.length>0){
    const last=runs[runs.length-1];
    last.text=last.text.replace(/\n$/,'');
  }
  // Remove empty runs
  return runs.filter(r=>r.text.length>0);
}
function normalizeColor(c){
  if(!c) return '#1a1a1a';
  if(c.startsWith('#')) return c;
  // rgb(r,g,b) → #hex
  const m=c.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
  if(m) return '#'+[m[1],m[2],m[3]].map(x=>(+x).toString(16).padStart(2,'0')).join('');
  return c;
}
// Apply execCommand for rich text formatting in contentEditable
function applyRichFormat(cmd,val){
  const ta=$('#ta');
  ta.focus();
  if(cmd==='foreColor'){
    document.execCommand('foreColor',false,val);
  }else if(cmd==='bold'){
    document.execCommand('bold',false,null);
  }else if(cmd==='italic'){
    document.execCommand('italic',false,null);
  }
}
// Word-wrap runs, returns array of lines, each line is array of {text,color,bold,italic}
function wrapRuns(ctx,runs,maxW,font,fontSize){
  if(!runs||!runs.length) return[[{text:'',color:'#1a1a1a',bold:false,italic:false}]];
  const result=[];
  // Flatten runs into segments split by newlines
  const flatSegs=[];
  for(const r of runs){
    const parts=r.text.split('\n');
    for(let pi=0;pi<parts.length;pi++){
      if(pi>0) flatSegs.push({text:'\n',color:r.color,bold:r.bold,italic:r.italic,isNL:true});
      if(parts[pi]) flatSegs.push({text:parts[pi],color:r.color,bold:r.bold,italic:r.italic,isNL:false});
    }
  }
  // Now process paragraph by paragraph
  let curPara=[];
  function flushPara(){
    if(curPara.length===0){result.push([{text:'',color:'#1a1a1a',bold:false,italic:false}]);return;}
    // Word-wrap the paragraph segments
    // Tokenize each segment into words (preserving CJK as single chars)
    const tokens=[];// {text, color, bold, italic, isSpace}
    for(const seg of curPara){
      const re=/[\u3000-\u9fff\uf900-\ufaff]|[^\s\u3000-\u9fff\uf900-\ufaff]+/g;
      let m,lastEnd=0;
      const t=seg.text;
      while((m=re.exec(t))!==null){
        // Any whitespace before this match
        if(m.index>lastEnd){
          tokens.push({text:t.slice(lastEnd,m.index),color:seg.color,bold:seg.bold,italic:seg.italic,isSpace:true});
        }
        tokens.push({text:m[0],color:seg.color,bold:seg.bold,italic:seg.italic,isSpace:false});
        lastEnd=m.index+m[0].length;
      }
      if(lastEnd<t.length){
        tokens.push({text:t.slice(lastEnd),color:seg.color,bold:seg.bold,italic:seg.italic,isSpace:true});
      }
    }
    // Now wrap tokens into lines
    let line=[];let lineW=0;
    function measureToken(tok){
      ctx.font=(tok.italic?'italic ':'')+(tok.bold?'bold ':'')+fontSize+'px '+font;
      return ctx.measureText(tok.text).width;
    }
    function pushLine(){if(line.length>0){result.push(mergeLineRuns(line));line=[];lineW=0;}}
    for(let ti=0;ti<tokens.length;ti++){
      const tok=tokens[ti];
      const tw=measureToken(tok);
      if(lineW+tw>maxW&&line.length>0&&!tok.isSpace){
        // Wrap: push current line, start new with this token
        pushLine();
        line.push({text:tok.text,color:tok.color,bold:tok.bold,italic:tok.italic});
        lineW=tw;
      }else{
        line.push({text:tok.text,color:tok.color,bold:tok.bold,italic:tok.italic});
        lineW+=tw;
      }
    }
    pushLine();
    curPara=[];
  }
  for(const seg of flatSegs){
    if(seg.isNL){flushPara();}
    else curPara.push(seg);
  }
  flushPara();
  return result;
}
function mergeLineRuns(tokens){
  const merged=[];
  for(const t of tokens){
    const last=merged[merged.length-1];
    if(last&&last.color===t.color&&last.bold===t.bold&&last.italic===t.italic){
      last.text+=t.text;
    }else{
      merged.push({text:t.text,color:t.color,bold:t.bold,italic:t.italic});
    }
  }
  return merged;
}

/* ── Render ── */
async function renderPage(){
  if(S.workspace==='whiteboard'){
    const w=WB_W,h=WB_H;
    pC.width=w;pC.height=h;dC.width=w;dC.height=h;dC.style.width=w+'px';dC.style.height=h+'px';
    pX.fillStyle='#fff';pX.fillRect(0,0,w,h);
    if(S.showGrid) drawGrid(w,h);
  }else if(S.pdf){
    const pg=await S.pdf.getPage(S.currentPage),vp=pg.getViewport({scale:1.5});
    pC.width=vp.width;pC.height=vp.height;dC.width=vp.width;dC.height=vp.height;
    dC.style.width=vp.width+'px';dC.style.height=vp.height+'px';
    await pg.render({canvasContext:pX,viewport:vp}).promise;
  }else return;
  replay();updPI();applyZoom();
}
function applyZoom(){
  const w=dC.width*S.zoom, h=dC.height*S.zoom;
  pC.style.width=w+'px';pC.style.height=h+'px';
  dC.style.width=w+'px';dC.style.height=h+'px';
}
function drawGrid(w,h){
  const step=40;
  pX.save();pX.strokeStyle='#dde0e4';pX.lineWidth=0.5;
  for(let x=step;x<w;x+=step){pX.beginPath();pX.moveTo(x,0);pX.lineTo(x,h);pX.stroke();}
  for(let y=step;y<h;y+=step){pX.beginPath();pX.moveTo(0,y);pX.lineTo(w,y);pX.stroke();}
  pX.restore();
}
$('#btnGrid').onclick=()=>{S.showGrid=!S.showGrid;$('#btnGrid').classList.toggle('on',S.showGrid);renderPage();};
$('#boardSize').onchange=e=>{
  const sz=BOARD_SIZES[e.target.value];
  if(sz){WB_W=sz[0];WB_H=sz[1];if(S.workspace==='whiteboard')renderPage();}
};
function replay(){
  dX.clearRect(0,0,dC.width,dC.height);
  (S.annotations[S.currentPage]||[]).forEach((a,i)=>{
    if(a.type==='text'&&i===S.editIdx){
      // Draw current contentEditable content on canvas (visible in Present window)
      const runs=domToRuns(ta);
      const text=runsToText(runs);
      if(text){
        dX.save();dX.globalAlpha=0.6;
        const ww=a.wrapW||(dC.width-a.x-10);
        const maxW=ww>50?ww:dC.width;
        const fnt=a.font||S.textFont;
        const fsz=a.fontSize||S.textSize;
        const lhm=a.lh||1.25;
        const lh=fsz*lhm;
        const lines=wrapRuns(dX,runs,maxW,fnt,fsz);
        lines.forEach((lineRuns,j)=>{
          let wx=a.x;
          const ly=a.y+(j+1)*lh;
          lineRuns.forEach(r=>{
            dX.fillStyle=r.color;
            dX.font=(r.italic?'italic ':'')+(r.bold?'bold ':'')+fsz+'px '+fnt;
            dX.fillText(r.text,wx,ly);
            wx+=dX.measureText(r.text).width;
          });
        });
        dX.restore();
      }
      return;
    }
    if(a.type==='stroke') drawStr(a);
    if(a.type==='text') drawTxt(a);
    if(a.type==='shape') drawShape(a);
    if(a.type==='image') drawImg(a);
  });
  // Draw selection boxes in select mode
  if(S.tool==='select'){
    const an=S.annotations[S.currentPage]||[];
    S.selectSet.forEach(idx=>{if(idx<an.length) drawSelBox(an[idx]);});
    if(selectHover>=0&&selectHover<an.length&&!S.selectSet.has(selectHover)) drawSelBox(an[selectHover],true);
  }
  // Always show lock indicator on locked items
  (S.annotations[S.currentPage]||[]).forEach(a=>{
    if(a.locked) drawLockIcon(a);
  });
  drawPrompt();
  // Draw in-progress revealed text
  if(REV.active&&REV.idx>0){
    const partial=REV.tokens.slice(0,REV.idx).join('');
    dX.save();dX.globalAlpha=1.0;dX.fillStyle=S.color;
    dX.font=(S.textItalic?'italic ':'')+(S.textBold?'bold ':'')+S.textSize+'px '+S.textFont;
    const maxW=dC.width-REV.x-10;
    const lines=wrapText(dX,partial,maxW>50?maxW:dC.width);
    const lh=S.textSize*(S.textLH||1.25);
    lines.forEach((l,i)=>dX.fillText(l,REV.x,REV.y+(i+1)*lh));
    dX.restore();
  }
}
function wrapText(ctx,text,maxW){
  const result=[];
  text.split('\n').forEach(para=>{
    const words=para.match(/[\u3000-\u9fff\uf900-\ufaff]|[^\s\u3000-\u9fff\uf900-\ufaff]+\s*/g)||[para];
    let line='';
    words.forEach(w=>{
      const test=line+w;
      if(ctx.measureText(test).width>maxW&&line){
        result.push(line);line=w;
      } else {line=test;}
    });
    if(line) result.push(line);
    if(!para) result.push('');
  });
  return result;
}
function drawPrompt(){
  const text=S.promptText;if(!text||!S.showPrompt) return;
  const area=document.querySelector('.canvas-area');if(!area) return;
  const sz=S.promptSize||20;
  const pad=12,margin=8;
  const viewW=Math.min(area.clientWidth/S.zoom,dC.width);
  const scrollX=area.scrollLeft/S.zoom, scrollY=area.scrollTop/S.zoom;
  dX.save();
  dX.font='bold '+sz+'px '+S.textFont;
  const maxW=viewW-pad*2-margin*2;
  const lines=wrapText(dX,text,maxW>10?maxW:viewW);
  const lh=sz*(S.promptLH||1.3);
  const tw=Math.min(Math.max(...lines.map(l=>dX.measureText(l).width)),maxW);
  const bw=tw+pad*2;
  const bh=lh*lines.length+pad*2;
  let bx,by;
  if(S.promptScreenX!==null){
    bx=S.promptScreenX+scrollX;by=S.promptScreenY+scrollY;
  } else {
    bx=scrollX+(viewW-bw)/2;by=scrollY+margin;
  }
  S._promptBounds={x:bx,y:by,w:bw,h:bh};
  if(S.promptAlpha>0){
    const bg=S.promptBg;
    const r=parseInt(bg.slice(1,3),16),g=parseInt(bg.slice(3,5),16),b=parseInt(bg.slice(5,7),16);
    dX.fillStyle='rgba('+r+','+g+','+b+','+S.promptAlpha+')';
    dX.beginPath();dX.roundRect(bx,by,bw,bh,6);dX.fill();
  }
  dX.fillStyle=S.promptFg;
  const align=S.promptAlign||'center';
  dX.textAlign=align;
  const tx=align==='left'?bx+pad:align==='right'?bx+bw-pad:bx+bw/2;
  lines.forEach((l,i)=>dX.fillText(l,tx,by+pad+sz*0.85+i*lh));
  dX.textAlign='start';dX.restore();
}
function hitPrompt(pos){
  if(!S.showPrompt||!S.promptText||!S._promptBounds) return false;
  const b=S._promptBounds;
  return pos.x>=b.x&&pos.x<=b.x+b.w&&pos.y>=b.y&&pos.y<=b.y+b.h;
}
function drawSelBox(a,isHover){
  const pad=6;
  let bx,by,bw,bh;
  if(a.type==='text'){
    bx=a.x-pad; by=a.y-pad;
    bw=(a._w||100)+pad*2; bh=(a._h||a.fontSize*1.25)+pad*2;
  } else if(a.type==='stroke'&&a.points.length>0){
    let mnx=Infinity,mny=Infinity,mxx=-Infinity,mxy=-Infinity;
    a.points.forEach(p=>{mnx=Math.min(mnx,p.x);mny=Math.min(mny,p.y);mxx=Math.max(mxx,p.x);mxy=Math.max(mxy,p.y);});
    bx=mnx-pad;by=mny-pad;bw=mxx-mnx+pad*2;bh=mxy-mny+pad*2;
  } else if(a.type==='shape'){
    bx=Math.min(a.x1,a.x2)-pad;by=Math.min(a.y1,a.y2)-pad;
    bw=Math.abs(a.x2-a.x1)+pad*2;bh=Math.abs(a.y2-a.y1)+pad*2;
  } else if(a.type==='image'){
    bx=a.x-pad;by=a.y-pad;bw=a.w+pad*2;bh=a.h+pad*2;
  } else return;
  dX.save();
  const locked=!!a.locked;
  dX.strokeStyle=locked?'#ff6b6b':isHover?'rgba(59,158,255,0.4)':'#3b9eff';
  dX.lineWidth=isHover?1:1.5;
  dX.setLineDash(locked?[3,3]:[5,3]);
  dX.strokeRect(bx,by,bw,bh);
  if(!isHover){
    dX.fillStyle=locked?'#ff6b6b':'#3b9eff';
    const hs=4;
    [[bx,by],[bx+bw,by],[bx,by+bh],[bx+bw,by+bh]].forEach(([cx,cy])=>{
      dX.fillRect(cx-hs,cy-hs,hs*2,hs*2);
    });
  }
  dX.restore();
}
function drawStr(a,fade){
  if(a.points.length<2) return;
  const f=fade!==undefined?fade:1;
  dX.save();dX.globalAlpha=a.alpha*f;dX.strokeStyle=a.color;dX.lineWidth=a.lineWidth;dX.lineCap='round';dX.lineJoin='round';
  dX.beginPath();dX.moveTo(a.points[0].x,a.points[0].y);
  for(let i=1;i<a.points.length;i++) dX.lineTo(a.points[i].x,a.points[i].y);
  dX.stroke();dX.restore();
}
function drawCanvasCursor(){
  if(S.cursorX<0||S.cursorY<0) return;
  dX.save();
  dX.strokeStyle='#3b9eff';dX.lineWidth=1.5;dX.globalAlpha=0.7;
  const r=8;
  // Crosshair
  dX.beginPath();dX.moveTo(S.cursorX-r,S.cursorY);dX.lineTo(S.cursorX+r,S.cursorY);dX.stroke();
  dX.beginPath();dX.moveTo(S.cursorX,S.cursorY-r);dX.lineTo(S.cursorX,S.cursorY+r);dX.stroke();
  dX.beginPath();dX.arc(S.cursorX,S.cursorY,r,0,Math.PI*2);dX.stroke();
  dX.restore();
}
function drawLockIcon(a){
  let x,y;
  if(a.type==='text'){x=a.x-2;y=a.y-2;}
  else if(a.type==='stroke'&&a.points.length>0){x=Math.min(...a.points.map(p=>p.x))-2;y=Math.min(...a.points.map(p=>p.y))-2;}
  else if(a.type==='shape'){x=Math.min(a.x1,a.x2)-2;y=Math.min(a.y1,a.y2)-2;}
  else if(a.type==='image'){x=a.x-2;y=a.y-2;}
  else return;
  dX.save();dX.font='10px sans-serif';dX.fillStyle='#ff6b6b';dX.globalAlpha=0.7;
  dX.fillText('🔒',x-12,y+4);dX.restore();
}
function drawImg(a,ctx,r){
  ctx=ctx||dX;r=r||1;
  let img=S.imgCache[a.imgId];
  if(!img){
    img=new Image();
    img.onload=()=>{S.imgCache[a.imgId]=img;replay();};
    img.src=a.src;
    return;
  }
  ctx.save();
  ctx.drawImage(img,a.x*r,a.y*r,a.w*r,a.h*r);
  ctx.restore();
}
function drawTxt(a){
  ensureRuns(a);
  dX.save();dX.globalAlpha=1.0;
  const ww=a.wrapW||(dC.width-a.x-10);
  const maxW=ww>50?ww:dC.width;
  if(!a.wrapW) a.wrapW=maxW;
  const lhm=a.lh||1.25;
  const lh=a.fontSize*lhm;
  const lines=wrapRuns(dX,a.runs,maxW,a.font,a.fontSize);
  lines.forEach((lineRuns,i)=>{
    const ly=a.y+(i+1)*lh;
    // Measure total line width for alignment
    let totalW=0;
    lineRuns.forEach(r=>{
      dX.font=(r.italic?'italic ':'')+(r.bold?'bold ':'')+a.fontSize+'px '+a.font;
      totalW+=dX.measureText(r.text).width;
    });
    if(a.align==='justify'&&i<lines.length-1){
      // Justify: distribute extra space between words
      // Collect all words across runs with their styles
      const wordEntries=[];
      for(const r of lineRuns){
        const words=r.text.split(/(\s+)/);
        for(const w of words){
          if(w) wordEntries.push({text:w,color:r.color,bold:r.bold,italic:r.italic,isSpace:/^\s+$/.test(w)});
        }
      }
      const nonSpaceWords=wordEntries.filter(w=>!w.isSpace);
      if(nonSpaceWords.length>1){
        let totalWordW=0;
        nonSpaceWords.forEach(w=>{
          dX.font=(w.italic?'italic ':'')+(w.bold?'bold ':'')+a.fontSize+'px '+a.font;
          totalWordW+=dX.measureText(w.text).width;
        });
        const gap=(maxW-totalWordW)/(nonSpaceWords.length-1);
        let wx=a.x;
        let nsIdx=0;
        for(const w of wordEntries){
          if(w.isSpace) continue;
          dX.fillStyle=w.color;
          dX.font=(w.italic?'italic ':'')+(w.bold?'bold ':'')+a.fontSize+'px '+a.font;
          dX.fillText(w.text,wx,ly);
          wx+=dX.measureText(w.text).width+gap;
          nsIdx++;
        }
      }else{
        let wx=a.x;
        lineRuns.forEach(r=>{
          dX.fillStyle=r.color;
          dX.font=(r.italic?'italic ':'')+(r.bold?'bold ':'')+a.fontSize+'px '+a.font;
          dX.fillText(r.text,wx,ly);
          wx+=dX.measureText(r.text).width;
        });
      }
    }else{
      let offsetX=0;
      if(a.align==='center') offsetX=(maxW-totalW)/2;
      else if(a.align==='right') offsetX=maxW-totalW;
      let wx=a.x+offsetX;
      lineRuns.forEach(r=>{
        dX.fillStyle=r.color;
        dX.font=(r.italic?'italic ':'')+(r.bold?'bold ':'')+a.fontSize+'px '+a.font;
        dX.fillText(r.text,wx,ly);
        wx+=dX.measureText(r.text).width;
      });
    }
  });
  a._w=maxW;a._h=lines.length*lh;
  dX.restore();
}
function drawShape(a,ctx,r){
  ctx=ctx||dX;r=r||1;
  ctx.save();ctx.globalAlpha=a.alpha;ctx.strokeStyle=a.color;ctx.lineWidth=a.lineWidth*r;
  ctx.lineCap='round';ctx.lineJoin='round';
  const x1=a.x1*r,y1=a.y1*r,x2=a.x2*r,y2=a.y2*r;
  if(a.shape==='line'||a.shape==='arrow'){
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
    if(a.shape==='arrow'){
      const angle=Math.atan2(y2-y1,x2-x1);
      const hl=Math.max(12,a.lineWidth*4)*r;
      ctx.beginPath();
      ctx.moveTo(x2,y2);
      ctx.lineTo(x2-hl*Math.cos(angle-0.4),y2-hl*Math.sin(angle-0.4));
      ctx.moveTo(x2,y2);
      ctx.lineTo(x2-hl*Math.cos(angle+0.4),y2-hl*Math.sin(angle+0.4));
      ctx.stroke();
    }
  }
  if(a.shape==='circle'){
    const rad=Math.hypot(x2-x1,y2-y1);
    ctx.beginPath();ctx.arc(x1,y1,rad,0,Math.PI*2);ctx.stroke();
  }
  if(a.shape==='ellipse'){
    const rx=Math.abs(x2-x1),ry=Math.abs(y2-y1);
    const cx=(x1+x2)/2,cy=(y1+y2)/2;
    ctx.beginPath();ctx.ellipse(cx,cy,rx/2,ry/2,0,0,Math.PI*2);ctx.stroke();
  }
  if(a.shape==='rect'){
    ctx.strokeRect(Math.min(x1,x2),Math.min(y1,y2),Math.abs(x2-x1),Math.abs(y2-y1));
  }
  if(a.shape==='rrect'){
    const rad=Math.min(12*r,Math.abs(x2-x1)/4,Math.abs(y2-y1)/4);
    ctx.beginPath();ctx.roundRect(Math.min(x1,x2),Math.min(y1,y2),Math.abs(x2-x1),Math.abs(y2-y1),rad);ctx.stroke();
  }
  ctx.restore();
}

/* ── Drawing ── */
let curStr=null,textDrag=null,shapeDrag=null;
function gP(e){const r=dC.getBoundingClientRect();return{x:(e.clientX-r.left)*dC.width/r.width,y:(e.clientY-r.top)*dC.height/r.height}}
function hitText(pos){
  const an=S.annotations[S.currentPage]||[];
  for(let i=an.length-1;i>=0;i--){const a=an[i];if(a.type!=='text'||a.locked)continue;
    const w=a._w||200,h=a._h||a.fontSize*1.5,pad=15;
    if(pos.x>=a.x-pad&&pos.x<=a.x+w+pad&&pos.y>=a.y-pad&&pos.y<=a.y+h+pad) return i;}
  return -1;
}

// Hit test any annotation type (for select tool)
function hitAny(pos){
  const an=S.annotations[S.currentPage]||[];
  const r=15;
  for(let i=an.length-1;i>=0;i--){
    const a=an[i];
    if(a.type==='text'){
      const w=a._w||200,h=a._h||a.fontSize*1.5;
      if(pos.x>=a.x-r&&pos.x<=a.x+w+r&&pos.y>=a.y-r&&pos.y<=a.y+h+r) return i;
    }
    if(a.type==='stroke'){
      for(let j=1;j<a.points.length;j++){
        if(distToSeg(pos.x,pos.y,a.points[j-1].x,a.points[j-1].y,a.points[j].x,a.points[j].y)<r) return i;
      }
    }
    if(a.type==='shape'){
      const cx=(a.x1+a.x2)/2,cy=(a.y1+a.y2)/2;
      const hw=Math.abs(a.x2-a.x1)/2+r,hh=Math.abs(a.y2-a.y1)/2+r;
      if(pos.x>=cx-hw&&pos.x<=cx+hw&&pos.y>=cy-hh&&pos.y<=cy+hh) return i;
    }
    if(a.type==='image'){
      if(pos.x>=a.x-r&&pos.x<=a.x+a.w+r&&pos.y>=a.y-r&&pos.y<=a.y+a.h+r) return i;
    }
  }
  return -1;
}

let selectDrag=null; // {idx, startPos, offsets}
let selectHover=-1; // index of hovered annotation in select mode
let resizeDrag=null; // {idx, startPos, origWrapW}

function hitResizeCorner(pos){
  const an=S.annotations[S.currentPage]||[];
  const hs=10;
  for(const idx of S.selectSet){
    const a=an[idx];
    if(!a) continue;
    if(a.type==='text'){
      const w=a._w||a.wrapW||200, h=a._h||a.fontSize*1.5;
      const cx=a.x+w+6, cy=a.y+h+6;
      if(Math.abs(pos.x-cx)<hs&&Math.abs(pos.y-cy)<hs) return idx;
    }
    if(a.type==='image'){
      const cx=a.x+a.w+6, cy=a.y+a.h+6;
      if(Math.abs(pos.x-cx)<hs&&Math.abs(pos.y-cy)<hs) return idx;
    }
  }
  return -1;
}

dC.addEventListener('mousedown',e=>{
  if(S.tool==='select'&&S.showPrompt&&S.promptText){
    const pos=gP(e);
    if(hitPrompt(pos)){
      const b=S._promptBounds;
      S._promptDrag={offX:pos.x-b.x,offY:pos.y-b.y};
      S.drawing=true;
      return;
    }
  }
  if(S.tool==='select'){
    const pos=gP(e);
    // Check for in-progress reveal text drag
    if(REV.active&&REV.idx>0){
      const pad=15;
      // Estimate bounds of revealed text
      dX.save();
      dX.font=(S.textItalic?'italic ':'')+(S.textBold?'bold ':'')+S.textSize+'px '+S.textFont;
      const partial=REV.tokens.slice(0,REV.idx).join('');
      const maxW=dC.width-REV.x-10;
      const lines=wrapText(dX,partial,maxW>50?maxW:dC.width);
      const tw=Math.max(...lines.map(l=>dX.measureText(l).width));
      dX.restore();
      const lh=S.textSize*(S.textLH||1.25);
      if(pos.x>=REV.x-pad&&pos.x<=REV.x+tw+pad&&pos.y>=REV.y-pad&&pos.y<=REV.y+lines.length*lh+pad){
        S._revDrag={offX:pos.x-REV.x,offY:pos.y-REV.y};
        S.drawing=true;
        return;
      }
    }
    // Check for resize corner drag first (not on locked items)
    const resizeIdx=hitResizeCorner(pos);
    if(resizeIdx>=0){
      const a=S.annotations[S.currentPage][resizeIdx];
      if(!a.locked){
        resizeDrag={idx:resizeIdx,startPos:pos,origWrapW:a.wrapW||(a._w||200),origW:a.w||200,origH:a.h||200};
        S.drawing=true;
        return;
      }
    }
    const hit=hitAny(pos),shift=e.shiftKey;
    if(hit>=0){
      if(shift){
        if(S.selectSet.has(hit)) S.selectSet.delete(hit);
        else S.selectSet.add(hit);
        selectHover=hit;
        replay();updateSelectTextBar();
      } else {
        if(!S.selectSet.has(hit)) S.selectSet=new Set([hit]);
        selectHover=hit;
        const an=S.annotations[S.currentPage]||[];
        // Check if any selected items are locked — if all locked, don't start drag
        let anyUnlocked=false;
        S.selectSet.forEach(idx=>{const a=an[idx];if(a&&!a.locked) anyUnlocked=true;});
        if(anyUnlocked){
          const origs=new Map();
          S.selectSet.forEach(idx=>{
            const a=an[idx];if(!a||a.locked)return;
            if(a.type==='text') origs.set(idx,{x:a.x,y:a.y});
            if(a.type==='stroke') origs.set(idx,{points:a.points.map(p=>({x:p.x,y:p.y}))});
            if(a.type==='shape') origs.set(idx,{x1:a.x1,y1:a.y1,x2:a.x2,y2:a.y2});
            if(a.type==='image') origs.set(idx,{x:a.x,y:a.y});
          });
          selectDrag={idx:hit,startPos:pos,moved:false,origs};
          S.drawing=true;
        }
        replay();updateSelectTextBar();
      }
    } else {
      if(!shift){S.selectSet.clear();selectHover=-1;}
      replay();updateSelectTextBar();
    }
    return;
  }
  if(S.tool==='reveal'){
    const pos=gP(e);
    // If there's active revealed text, check if clicking on it to drag
    if(REV.active&&REV.idx>0){
      const pad=15;
      dX.save();
      dX.font=(S.textItalic?'italic ':'')+(S.textBold?'bold ':'')+S.textSize+'px '+S.textFont;
      const partial=REV.tokens.slice(0,REV.idx).join('');
      const maxW=dC.width-REV.x-10;
      const lines=wrapText(dX,partial,maxW>50?maxW:dC.width);
      const tw=Math.max(...lines.map(l=>dX.measureText(l).width));
      dX.restore();
      const lh=S.textSize*(S.textLH||1.25);
      if(pos.x>=REV.x-pad&&pos.x<=REV.x+tw+pad&&pos.y>=REV.y-pad&&pos.y<=REV.y+lines.length*lh+pad){
        S._revDrag={offX:pos.x-REV.x,offY:pos.y-REV.y};
        S.drawing=true;
        return;
      }
    }
    revealStart(pos.x,pos.y);
    return;
  }
  if(S.tool==='text'){
    const pos=gP(e),hit=hitText(pos);
    if(hit>=0){const a=S.annotations[S.currentPage][hit];textDrag={idx:hit,startPos:pos,origX:a.x,origY:a.y,moved:false};S.drawing=true;}
    else openNewText(e);
    return;
  }
  if(S.tool==='eraser'){eraseAt(e);S.drawing=true;return;}
  if(SHAPES.includes(S.tool)){
    S.drawing=true;const pos=gP(e);
    shapeDrag={shape:S.tool,x1:pos.x,y1:pos.y,x2:pos.x,y2:pos.y,color:S.color,lineWidth:S.lineWidth,alpha:S.alpha};
    return;
  }
  S.drawing=true;const pos=gP(e);
  curStr={type:'stroke',color:S.color,lineWidth:S.lineWidth,alpha:S.alpha,points:[pos],isLaser:S.tool==='laser',started:false};
  S.lastX=pos.x;S.lastY=pos.y;
});

dC.addEventListener('mousemove',e=>{
  const cp=gP(e);S.cursorX=cp.x;S.cursorY=cp.y;
  if(S.tool==='select'&&!S.drawing&&S.showPrompt&&S.promptText){
    const pos=gP(e);if(hitPrompt(pos)){dC.style.cursor='move';return;}
  }
  if(S.tool==='select'&&!S.drawing){
    const pos=gP(e);
    if(hitResizeCorner(pos)>=0){dC.style.cursor='nwse-resize';return;}
    const hit=hitAny(pos);
    dC.style.cursor=hit>=0?'move':'default';
    if(hit!==selectHover){selectHover=hit;replay();}
  }
  if(S.tool==='text'&&!S.drawing){dC.style.cursor=hitText(gP(e))>=0?'move':'text';}
  if(!S.drawing) return;
  if(S._promptDrag){
    const pos=gP(e);
    const area=document.querySelector('.canvas-area');
    S.promptScreenX=pos.x-S._promptDrag.offX-area.scrollLeft/S.zoom;
    S.promptScreenY=pos.y-S._promptDrag.offY-area.scrollTop/S.zoom;
    replay();return;
  }
  if(S._revDrag){
    const pos=gP(e);
    REV.x=pos.x-S._revDrag.offX;
    REV.y=pos.y-S._revDrag.offY;
    drawRevealedText();updateRevCursor();return;
  }
  if(resizeDrag){
    const pos=gP(e);
    const a=S.annotations[S.currentPage][resizeDrag.idx];
    if(a&&a.type==='text'){
      a.wrapW=Math.max(30,pos.x-a.x);
      a._w=a.wrapW;
      replay();
    }
    if(a&&a.type==='image'){
      const nw=Math.max(20,pos.x-a.x);
      const ratio=resizeDrag.origH/resizeDrag.origW;
      a.w=Math.round(nw);a.h=Math.round(nw*ratio);
      replay();
    }
    return;
  }
  if(S.tool==='select'&&selectDrag){
    const pos=gP(e),dx=pos.x-selectDrag.startPos.x,dy=pos.y-selectDrag.startPos.y;
    if(Math.abs(dx)>3||Math.abs(dy)>3) selectDrag.moved=true;
    if(selectDrag.moved){
      const an=S.annotations[S.currentPage]||[];
      selectDrag.origs.forEach((orig,idx)=>{
        const a=an[idx];if(!a)return;
        if(a.type==='text'){a.x=orig.x+dx;a.y=orig.y+dy;}
        if(a.type==='stroke'){a.points=orig.points.map(p=>({x:p.x+dx,y:p.y+dy}));}
        if(a.type==='shape'){a.x1=orig.x1+dx;a.y1=orig.y1+dy;a.x2=orig.x2+dx;a.y2=orig.y2+dy;}
        if(a.type==='image'){a.x=orig.x+dx;a.y=orig.y+dy;}
      });
      replay();
    }
    return;
  }
  if(S.tool==='text'&&textDrag){
    const pos=gP(e),dx=pos.x-textDrag.startPos.x,dy=pos.y-textDrag.startPos.y;
    if(Math.abs(dx)>4||Math.abs(dy)>4) textDrag.moved=true;
    if(textDrag.moved){const a=S.annotations[S.currentPage][textDrag.idx];a.x=textDrag.origX+dx;a.y=textDrag.origY+dy;replay();}
    return;
  }
  if(S.tool==='eraser'){eraseAt(e);return;}
  if(SHAPES.includes(S.tool)&&shapeDrag){
    const pos=gP(e);shapeDrag.x2=pos.x;shapeDrag.y2=pos.y;
    replay(); // redraw existing annotations
    drawShape({type:'shape',...shapeDrag}); // preview
    return;
  }
  if((S.tool==='pen'||S.tool==='laser')&&curStr){
    const pos=gP(e);
    if(!curStr.started){
      const d=Math.hypot(pos.x-curStr.points[0].x,pos.y-curStr.points[0].y);
      if(d<MIN_STROKE) return;
      curStr.started=true;
    }
    curStr.points.push(pos);
    dX.save();dX.globalAlpha=S.alpha;dX.strokeStyle=S.color;dX.lineWidth=S.lineWidth;
    dX.lineCap='round';dX.lineJoin='round';dX.beginPath();
    dX.moveTo(S.lastX,S.lastY);dX.lineTo(pos.x,pos.y);dX.stroke();dX.restore();
    S.lastX=pos.x;S.lastY=pos.y;
  }
});

function finStr(){
  if(S._promptDrag){S._promptDrag=null;S.drawing=false;return;}
  if(S._revDrag){S._revDrag=null;S.drawing=false;return;}
  if(resizeDrag){resizeDrag=null;S.drawing=false;autoSave();return;}
  if(S.tool==='select'&&selectDrag){
    if(selectDrag.moved) autoSave();
    selectDrag=null;S.drawing=false;return;
  }
  if(S.tool==='text'&&textDrag){if(!textDrag.moved) openEditText(textDrag.idx);textDrag=null;S.drawing=false;return;}
  if(SHAPES.includes(S.tool)&&shapeDrag){
    const dx=shapeDrag.x2-shapeDrag.x1,dy=shapeDrag.y2-shapeDrag.y1;
    if(Math.hypot(dx,dy)>MIN_STROKE){
      pushAn({type:'shape',shape:shapeDrag.shape,x1:shapeDrag.x1,y1:shapeDrag.y1,x2:shapeDrag.x2,y2:shapeDrag.y2,color:shapeDrag.color,lineWidth:shapeDrag.lineWidth,alpha:shapeDrag.alpha});
    }
    shapeDrag=null;S.drawing=false;replay();return;
  }
  if(!curStr||curStr.points.length<2||!curStr.started){curStr=null;S.drawing=false;return;}
  if(curStr.isLaser){curStr.timestamp=performance.now();curStr.fadeTime=S.fadeTime;S.laserStrokes.push(curStr);startLA();}
  else pushAn(curStr);
  curStr=null;S.drawing=false;
}
dC.addEventListener('mouseup',finStr);
dC.addEventListener('mouseleave',()=>{S.cursorX=-1;S.cursorY=-1;if(selectDrag&&selectDrag.moved){selectDrag=null;S.drawing=false;}else if(textDrag&&textDrag.moved){textDrag=null;S.drawing=false;}else finStr();});

/* ── Touch support (iPad / tablet) ── */
function touchToMouse(e){
  const t=e.touches[0]||e.changedTouches[0];
  return{clientX:t.clientX,clientY:t.clientY,target:e.target,preventDefault:()=>e.preventDefault(),stopPropagation:()=>e.stopPropagation()};
}
dC.addEventListener('touchstart',e=>{e.preventDefault();dC.dispatchEvent(new MouseEvent('mousedown',touchToMouse(e)));},{passive:false});
dC.addEventListener('touchmove',e=>{e.preventDefault();dC.dispatchEvent(new MouseEvent('mousemove',touchToMouse(e)));},{passive:false});
dC.addEventListener('touchend',e=>{e.preventDefault();dC.dispatchEvent(new MouseEvent('mouseup',touchToMouse(e)));},{passive:false});

/* ── Laser anim ── */
function startLA(){if(S.animating)return;S.animating=true;requestAnimationFrame(animLA);}
function animLA(){
  const now=performance.now();
  S.laserStrokes=S.laserStrokes.filter(s=>(now-s.timestamp)/1000<s.fadeTime);
  dX.clearRect(0,0,dC.width,dC.height);
  (S.annotations[S.currentPage]||[]).forEach((a,i)=>{if(a.type==='text'&&i===S.editIdx)return;if(a.type==='stroke')drawStr(a);if(a.type==='text')drawTxt(a);if(a.type==='shape')drawShape(a);});
  S.laserStrokes.forEach(s=>{const age=(now-s.timestamp)/1000;drawStr(s,Math.max(0,1-age/s.fadeTime));});
  if(curStr&&curStr.points.length>=2&&curStr.started) drawStr(curStr);
  // Keep reveal text visible during laser animation
  if(REV.active&&REV.idx>0){
    const partial=REV.tokens.slice(0,REV.idx).join('');
    dX.save();dX.globalAlpha=1.0;dX.fillStyle=S.color;
    dX.font=(S.textItalic?'italic ':'')+(S.textBold?'bold ':'')+S.textSize+'px '+S.textFont;
    const maxW=dC.width-REV.x-10;
    const lines=wrapText(dX,partial,maxW>50?maxW:dC.width);
    const lh=S.textSize*(S.textLH||1.25);
    lines.forEach((l,i)=>dX.fillText(l,REV.x,REV.y+(i+1)*lh));
    dX.restore();
  }
  drawPrompt();
  if(S.laserStrokes.length>0) requestAnimationFrame(animLA);else S.animating=false;
}

/* ── Eraser ── */
function distToSeg(px,py,x1,y1,x2,y2){
  const dx=x2-x1,dy=y2-y1,t=Math.max(0,Math.min(1,((px-x1)*dx+(py-y1)*dy)/(dx*dx+dy*dy)));
  return Math.hypot(px-(x1+t*dx),py-(y1+t*dy));
}
function eraseAt(e){
  const pos=gP(e),r=20,pg=S.currentPage,an=S.annotations[pg]||[],b=an.length;
  S.annotations[pg]=an.filter(a=>{
    if(a.locked) return true; // can't erase locked items
    if(a.type==='stroke') return !a.points.some(p=>Math.hypot(p.x-pos.x,p.y-pos.y)<r);
    if(a.type==='text'){const w=a._w||200,h=a._h||a.fontSize*1.5;return!(pos.x>=a.x-4&&pos.x<=a.x+w+4&&pos.y>=a.y-4&&pos.y<=a.y+h+4);}
    if(a.type==='shape'){
      if(a.shape==='line'||a.shape==='arrow') return distToSeg(pos.x,pos.y,a.x1,a.y1,a.x2,a.y2)>r;
      if(a.shape==='circle'){const rad=Math.hypot(a.x2-a.x1,a.y2-a.y1);return Math.abs(Math.hypot(pos.x-a.x1,pos.y-a.y1)-rad)>r;}
      if(a.shape==='ellipse'){const cx=(a.x1+a.x2)/2,cy=(a.y1+a.y2)/2,rx=Math.abs(a.x2-a.x1)/2,ry=Math.abs(a.y2-a.y1)/2;if(rx<1||ry<1)return true;const n=Math.hypot((pos.x-cx)/rx,(pos.y-cy)/ry);return Math.abs(n-1)*Math.min(rx,ry)>r;}
    }
    if(a.type==='image'){return!(pos.x>=a.x-4&&pos.x<=a.x+a.w+4&&pos.y>=a.y-4&&pos.y<=a.y+a.h+4);}
    return true;
  });
  if((S.annotations[pg]||[]).length!==b) replay();
}

/* ── Text ── */
const tov=$('#tov'),ta=$('#ta');let commitGuard=false;

function openNewText(e){
  S.editIdx=-1;const r=dC.getBoundingClientRect();const x=e.clientX-r.left,y=e.clientY-r.top;
  tov.style.display='block';tov.style.left=x+'px';tov.style.top=y+'px';tov._sx=x;tov._sy=y;tov._cx=null;tov._cy=null;
  ta.innerHTML='';updTA();ta.style.color=S.color;ta.style.width='220px';ta.style.height='36px';
  dC.style.pointerEvents='none';commitGuard=false;setTimeout(()=>ta.focus(),50);
}
function openEditText(idx){
  const a=(S.annotations[S.currentPage]||[])[idx];if(!a) return;
  ensureRuns(a);
  S.editIdx=idx;replay(); // hide from canvas
  S.textFont=a.font;S.textSize=a.fontSize;
  // Use first run's style for toolbar defaults
  const r0=a.runs[0]||{color:'#1a1a1a',bold:false,italic:false};
  S.textBold=r0.bold;S.textItalic=r0.italic;S.color=r0.color;
  S.alpha=1.0;
  $('#fSel').value=a.font;$('#fSize').value=a.fontSize;$('#btnB').classList.toggle('on',S.textBold);$('#btnI').classList.toggle('on',S.textItalic);
  const rc=dC.getBoundingClientRect(),sx=a.x*rc.width/dC.width,sy=a.y*rc.height/dC.height;
  tov.style.display='block';tov.style.left=sx+'px';tov.style.top=sy+'px';tov._sx=sx;tov._sy=sy;tov._cx=a.x;tov._cy=a.y;
  // Populate contentEditable from runs
  runsToDOM(ta,a.runs,a.font,a.fontSize);
  updTA();
  // Highlight palette color
  $$('.cs').forEach(s=>{s.classList.toggle('on',s.dataset.color===r0.color);});
  const text=runsToText(a.runs);
  const lines=text.split('\n');
  ta.style.width=Math.max(220,(a._w||200)*rc.width/dC.width+24)+'px';
  ta.style.height=Math.max(36,lines.length*a.fontSize*1.25*rc.height/dC.height+16)+'px';
  dC.style.pointerEvents='none';commitGuard=false;setTimeout(()=>{ta.focus();
    // Place cursor at end
    const sel=window.getSelection();sel.selectAllChildren(ta);sel.collapseToEnd();
  },50);
}
function hideTO(){tov.style.display='none';dC.style.pointerEvents='auto';S.editIdx=-1;}

function commitText(){
  if(commitGuard)return;commitGuard=true;
  const runs=domToRuns(ta);
  const text=runsToText(runs).trim();
  if(!text){S.editIdx=-1;hideTO();replay();return;}
  const r=dC.getBoundingClientRect(),scX=dC.width/r.width,scY=dC.height/r.height;
  const cx=tov._cx!==null?tov._cx:tov._sx*scX,cy=tov._cy!==null?tov._cy:tov._sy*scY;
  const lines=text.split('\n'),lh=S.textSize*(S.textLH||1.25);
  dX.font=(S.textItalic?'italic ':'')+(S.textBold?'bold ':'')+S.textSize+'px '+S.textFont;
  const mw=Math.max(...lines.map(l=>dX.measureText(l).width));
  // Trim whitespace from run texts (only leading/trailing of entire text)
  const trimmedRuns=JSON.parse(JSON.stringify(runs));
  if(trimmedRuns.length>0){
    trimmedRuns[0].text=trimmedRuns[0].text.replace(/^\s+/,'');
    trimmedRuns[trimmedRuns.length-1].text=trimmedRuns[trimmedRuns.length-1].text.replace(/\s+$/,'');
  }
  const finalRuns=trimmedRuns.filter(r=>r.text.length>0);
  if(!finalRuns.length){S.editIdx=-1;hideTO();replay();return;}
  const an={type:'text',runs:finalRuns,x:cx,y:cy,font:S.textFont,fontSize:S.textSize,align:S.textAlign,lh:S.textLH,_w:mw,_h:lines.length*lh};
  const pg=S.currentPage,idx=S.editIdx;
  if(idx>=0&&S.annotations[pg]&&idx<S.annotations[pg].length){
    const old=S.annotations[pg][idx];
    if(old.locked) an.locked=true;
    if(old.wrapW) an.wrapW=old.wrapW;
    S.annotations[pg][idx]=an;
  } else pushAn(an);
  S.editIdx=-1;replay();hideTO();autoSave();
}
ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();commitText();}if(e.key==='Escape'){S.editIdx=-1;hideTO();replay();}e.stopPropagation();});
ta.addEventListener('input',()=>{if(S.editIdx>=0) replay();}); // update Present window in real-time
ta.addEventListener('blur',()=>{setTimeout(()=>{if(tov.style.display==='none')return;if(commitGuard)return;if(ta.textContent.trim())commitText();else{S.editIdx=-1;hideTO();replay();}},200);});

/* ── Annotations, Undo/Redo ── */
function pushAn(a){
  const pg=S.currentPage;
  if(!S.annotations[pg])S.annotations[pg]=[];
  if(!S.undoStack[pg])S.undoStack[pg]=[];
  S.annotations[pg].push(a);
  S.undoStack[pg].push(JSON.parse(JSON.stringify(S.annotations[pg])));
  S.redoStack[pg]=[];
  autoSave();
}
function undo(){
  const pg=S.currentPage,st=S.undoStack[pg];if(!st||!st.length)return;
  if(!S.redoStack[pg])S.redoStack[pg]=[];
  S.redoStack[pg].push(JSON.parse(JSON.stringify(S.annotations[pg])));
  st.pop();
  S.annotations[pg]=st.length>0?JSON.parse(JSON.stringify(st[st.length-1])):[];
  replay();autoSave();
}
function redo(){
  const pg=S.currentPage,rs=S.redoStack[pg];if(!rs||!rs.length)return;
  const state=rs.pop();
  if(!S.undoStack[pg])S.undoStack[pg]=[];
  S.undoStack[pg].push(JSON.parse(JSON.stringify(state)));
  S.annotations[pg]=state;
  replay();autoSave();
}

$('#btnRedo').onclick=redo;

/* ── Session Save/Load (JSON file, no browser storage) ── */
function arrayBufToBase64(buf){
  const bytes=new Uint8Array(buf);let s='';
  for(let i=0;i<bytes.length;i+=8192) s+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));
  return btoa(s);
}
function base64ToArrayBuf(b64){
  const s=atob(b64),buf=new Uint8Array(s.length);
  for(let i=0;i<s.length;i++) buf[i]=s.charCodeAt(i);
  return buf.buffer;
}

$('#btnSaveSession').onclick=()=>{
  try{
    if(!tabs.length) return;
    if(activeTab) saveToTab(activeTab);
    const tabData=tabs.map(t=>({
      type:t.type,name:t.name,annotations:t.annotations,
      currentPage:t.currentPage,totalPages:t.totalPages,
      typeBoxes:t.typeBoxes||[],
      prompt:t.prompt||{},
      pdfBase64:t.pdfData&&t.pdfData.byteLength>0?arrayBufToBase64(t.pdfData.slice(0)):null
    }));
    const session={tabs:tabData};
    const json=JSON.stringify(session);
    if(window._isIOSApp){
      const b64=btoa(unescape(encodeURIComponent(json)));
      window._iosSaveFile(b64,'LecturePad_session.json');
    }else{
      const blob=new Blob([json],{type:'application/json'});
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download='LecturePad_session.json';
      document.body.appendChild(a);a.click();
      setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(a.href);},100);
    }
  }catch(e){alert('Session save failed: '+e.message);console.error(e);}
};

$('#btnLoadSession').onclick=()=>sessionInput.click();
sessionInput.onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    const text=await f.text();
    const raw=JSON.parse(text);
    const data=Array.isArray(raw)?raw:raw.tabs;
    if(!Array.isArray(data)||!data.length){alert('Invalid session file');return;}
    tabs=[];activeTab=null;tabId=0;
    for(const d of data){
      let pdf=null,pdfData=null;
      if(d.pdfBase64){
        try{pdfData=base64ToArrayBuf(d.pdfBase64);pdf=await pdfjsLib.getDocument({data:pdfData.slice(0)}).promise;}
        catch(err){pdfData=null;pdf=null;}
      }
      const t={id:++tabId,type:d.type||'whiteboard',name:d.hasPdf&&!pdf?d.name+' ⚠':d.name||'Tab',
        pdf,pdfData,annotations:d.annotations||{},undoStack:{},redoStack:{},
        currentPage:d.currentPage||1,totalPages:d.totalPages||1,
        typeBoxes:d.typeBoxes||[{text:'',status:'ready'}],
        prompt:d.prompt||{text:'',size:20,bg:'#000000',fg:'#ffffff',alpha:0.75,align:'left',show:false}};
      tabs.push(t);
    }
    // Backward compat: old format had global typeBoxes/prompt — apply to first tab
    if(!Array.isArray(raw)&&raw.typeBoxes&&!data[0].typeBoxes){
      tabs[0].typeBoxes=raw.typeBoxes;
    }
    if(!Array.isArray(raw)&&raw.prompt&&(!data[0].prompt||!data[0].prompt.text)){
      tabs[0].prompt=raw.prompt;
    }
    renderTabs();
    if(tabs.length)switchTab(tabs[0].id);
  }catch(err){alert('Failed to load session: '+err.message);}
  e.target.value='';
};

/* ── Auto-save (IndexedDB only — no localStorage size limits) ── */
const AS_DB='lecturepad_autosave',AS_VER=1,AS_STORE='data';
function asOpen(){return new Promise((res,rej)=>{const r=indexedDB.open(AS_DB,AS_VER);r.onupgradeneeded=()=>r.result.createObjectStore(AS_STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);})}
async function asSet(k,v){try{const db=await asOpen();const tx=db.transaction(AS_STORE,'readwrite');tx.objectStore(AS_STORE).put(v,k);await new Promise((r,j)=>{tx.oncomplete=r;tx.onerror=j;});}catch(e){}}
async function asGet(k){try{const db=await asOpen();return new Promise(r=>{const q=db.transaction(AS_STORE,'readonly').objectStore(AS_STORE).get(k);q.onsuccess=()=>r(q.result===undefined?null:q.result);q.onerror=()=>r(null);});}catch(e){return null;}}
async function asClear(){try{indexedDB.deleteDatabase(AS_DB);}catch(e){}}

let _saveTimer=null;
function autoSave(){
  clearTimeout(_saveTimer);
  _saveTimer=setTimeout(async()=>{
    try{
      if(activeTab) saveToTab(activeTab);
      const snap=tabs.map(t=>({
        id:t.id,type:t.type,name:t.name,
        annotations:t.annotations,
        currentPage:t.currentPage,totalPages:t.totalPages,
        hasPdf:!!t.pdfData,
        typeBoxes:t.typeBoxes||[],
        prompt:t.prompt||{}
      }));
      await asSet('tabs',snap);
      await asSet('active',activeTab);
      await asSet('tabId',tabId);
      for(const t of tabs){if(t.pdfData&&t.pdfData.byteLength>0) await asSet('pdf_'+t.id,t.pdfData.slice(0));}
    }catch(e){/* best-effort */}
  },1000);
}

async function autoRestore(){
  try{
    const snap=await asGet('tabs');
    if(!Array.isArray(snap)||!snap.length) return false;
    const tmp=[];
    for(const d of snap){
      if(!d||!d.type||!d.name) continue;
      let pdf=null,pdfData=null;
      if(d.hasPdf){
        try{
          pdfData=await asGet('pdf_'+d.id);
          if(pdfData) pdf=await pdfjsLib.getDocument({data:pdfData.slice(0)}).promise;
        }catch(e){pdfData=null;pdf=null;}
      }
      tmp.push({id:d.id||0,type:d.type,name:d.hasPdf&&!pdf?d.name+' ⚠':d.name,
        pdf,pdfData,annotations:d.annotations||{},undoStack:{},redoStack:{},
        currentPage:d.currentPage||1,totalPages:d.totalPages||1,
        typeBoxes:d.typeBoxes||[{text:'',status:'ready'}],
        prompt:d.prompt||{text:'',size:20,bg:'#000000',fg:'#ffffff',alpha:0.75,align:'left',show:false}});
    }
    if(!tmp.length) return false;
    tabs=tmp;
    tabId=(await asGet('tabId'))||Math.max(...tabs.map(t=>t.id));
    renderTabs();
    const sa=(await asGet('active'))||tabs[0].id;
    switchTab(tabs.find(x=>x.id===sa)?sa:tabs[0].id);
    return true;
  }catch(e){
    console.warn('Auto-restore failed:',e);
    await asClear();
    return false;
  }
}

// Try restore on load — Welcome stays visible until success
setTimeout(async()=>{
  try{const ok=await Promise.race([autoRestore(),new Promise(r=>setTimeout(()=>r(false),3000))]);
    if(!ok){tabs=[];activeTab=null;tabId=0;}
  }catch(e){tabs=[];activeTab=null;tabId=0;}
},100);

/* ── Save ── */
function renderAnToCtx(ctx,annots,ratio){annots.forEach(a=>{if(a.type==='stroke'&&a.points.length>=2){ctx.save();ctx.globalAlpha=a.alpha;ctx.strokeStyle=a.color;ctx.lineWidth=a.lineWidth*ratio;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(a.points[0].x*ratio,a.points[0].y*ratio);for(let i=1;i<a.points.length;i++)ctx.lineTo(a.points[i].x*ratio,a.points[i].y*ratio);ctx.stroke();ctx.restore();}if(a.type==='text'){ensureRuns(a);ctx.save();ctx.globalAlpha=1.0;const sz=a.fontSize*ratio;const ww=a.wrapW?(a.wrapW*ratio):(ctx.canvas.width-a.x*ratio-10);const maxW=ww>50?ww:ctx.canvas.width;const lhm=a.lh||1.25;const lh=a.fontSize*lhm;const lines=wrapRuns(ctx,a.runs,maxW,a.font,sz);lines.forEach((lineRuns,i)=>{const ly=(a.y+(i+1)*lh)*ratio;let totalW=0;lineRuns.forEach(r=>{ctx.font=(r.italic?'italic ':'')+(r.bold?'bold ':'')+sz+'px '+a.font;totalW+=ctx.measureText(r.text).width;});if(a.align==='justify'&&i<lines.length-1){const wordEntries=[];for(const r of lineRuns){const words=r.text.split(/(\s+)/);for(const w of words){if(w)wordEntries.push({text:w,color:r.color,bold:r.bold,italic:r.italic,isSpace:/^\s+$/.test(w)});}}const nonSpaceWords=wordEntries.filter(w=>!w.isSpace);if(nonSpaceWords.length>1){let tww=0;nonSpaceWords.forEach(w=>{ctx.font=(w.italic?'italic ':'')+(w.bold?'bold ':'')+sz+'px '+a.font;tww+=ctx.measureText(w.text).width;});const gap=(maxW-tww)/(nonSpaceWords.length-1);let wx=a.x*ratio;for(const w of wordEntries){if(w.isSpace)continue;ctx.fillStyle=w.color;ctx.font=(w.italic?'italic ':'')+(w.bold?'bold ':'')+sz+'px '+a.font;ctx.fillText(w.text,wx,ly);wx+=ctx.measureText(w.text).width+gap;}}else{let wx=a.x*ratio;lineRuns.forEach(r=>{ctx.fillStyle=r.color;ctx.font=(r.italic?'italic ':'')+(r.bold?'bold ':'')+sz+'px '+a.font;ctx.fillText(r.text,wx,ly);wx+=ctx.measureText(r.text).width;});}}else{let offsetX=0;if(a.align==='center')offsetX=(maxW-totalW)/2;else if(a.align==='right')offsetX=maxW-totalW;let wx=a.x*ratio+offsetX;lineRuns.forEach(r=>{ctx.fillStyle=r.color;ctx.font=(r.italic?'italic ':'')+(r.bold?'bold ':'')+sz+'px '+a.font;ctx.fillText(r.text,wx,ly);wx+=ctx.measureText(r.text).width;});}});ctx.restore();}if(a.type==='shape'){drawShape(a,ctx,ratio);}if(a.type==='image'){drawImg(a,ctx,ratio);}});}

$('#btnSave').onclick=async()=>{
  try{
    if(S.workspace==='none')return;if(activeTab)saveToTab(activeTab);
    if(!window.jspdf){alert('jsPDF not loaded. Check network.');return;}
    const{jsPDF}=window.jspdf;let doc=null;const expS=2,ratio=expS/1.5;
    for(let pg=1;pg<=S.totalPages;pg++){let c2;
      if(S.workspace==='pdf'&&S.pdf&&pg<=S.pdf.numPages){
        const page=await S.pdf.getPage(pg),vp=page.getViewport({scale:expS});
        const c1=document.createElement('canvas');c1.width=vp.width;c1.height=vp.height;
        await page.render({canvasContext:c1.getContext('2d'),viewport:vp}).promise;
        c2=document.createElement('canvas');c2.width=vp.width;c2.height=vp.height;
        const x2=c2.getContext('2d');x2.drawImage(c1,0,0);renderAnToCtx(x2,S.annotations[pg]||[],ratio);
      }else{
        const w=Math.round(WB_W*expS/1.5),h=Math.round(WB_H*expS/1.5);
        c2=document.createElement('canvas');c2.width=w;c2.height=h;
        const x2=c2.getContext('2d');x2.fillStyle='#fff';x2.fillRect(0,0,w,h);renderAnToCtx(x2,S.annotations[pg]||[],ratio);
      }
      const img=c2.toDataURL('image/jpeg',.92),pm=25.4/96,wM=c2.width*pm/2,hM=c2.height*pm/2;
      if(pg===1)doc=new jsPDF({orientation:wM>hM?'l':'p',unit:'mm',format:[wM,hM]});else doc.addPage([wM,hM],wM>hM?'l':'p');
      doc.addImage(img,'JPEG',0,0,wM,hM);
    }
    const t=tabs.find(x=>x.id===activeTab);const fn=(t?t.name:'LecturePad')+'_annotated.pdf';
    if(doc){
      if(window._isIOSApp){
        const arr=new Uint8Array(doc.output('arraybuffer'));
        let b64='';const chunk=8192;
        for(let i=0;i<arr.length;i+=chunk) b64+=String.fromCharCode.apply(null,arr.subarray(i,i+chunk));
        window._iosSaveFile(btoa(b64),fn);
      }else{doc.save(fn);}
    }
  }catch(e){alert('Export failed: '+e.message);console.error(e);}
};

/* ── Type Mode (multi-box) ── */
const REV={boxes:[],selIdx:-1,tokens:[],idx:0,x:0,y:0,active:false,autoTimer:null,speed:0.5};
window.REV=REV;

function tokenize(text){
  const tokens=[];
  const re=/[\u3000-\u9fff\uf900-\ufaff]|[a-zA-Z0-9''\-]+[\s]*|[^\sa-zA-Z0-9\u3000-\u9fff\uf900-\ufaff''\-]+[\s]*/g;
  let m;
  while((m=re.exec(text))!==null) tokens.push(m[0]);
  return tokens;
}

function addRevBox(text){
  const id=REV.boxes.length;
  REV.boxes.push({text:text||'',status:'ready'});
  renderRevBoxes();
  if(REV.selIdx<0) selectRevBox(id);
  autoSave();
}

function removeRevBox(idx){
  if(REV.selIdx===idx){REV.active=false;hideRevCursor();REV.selIdx=-1;}
  else if(REV.selIdx>idx) REV.selIdx--;
  REV.boxes.splice(idx,1);
  renderRevBoxes();
  autoSave();
}

function selectRevBox(idx){
  if(REV.selIdx===idx&&!REV.active) return; // already selected and not revealing
  // Cancel current reveal if switching boxes
  if(REV.active){REV.active=false;stopRevealAuto();hideRevCursor();replay();}
  REV.selIdx=idx;
  // Update CSS classes
  document.querySelectorAll('.rev-box').forEach((el,i)=>{
    el.classList.toggle('sel',i===idx);
  });
  const b=REV.boxes[idx];
  if(b.status==='done'){
    REV._statusText='#'+(idx+1)+' done \u2014 click canvas to redo';
  }else{
    REV._statusText='#'+(idx+1)+' selected \u2014 click canvas to place';
  }
}

function resetRevBox(idx){
  REV.boxes[idx].status='ready';
  if(REV.selIdx===idx){REV.active=false;hideRevCursor();stopRevealAuto();}
  REV.selIdx=idx;
  renderRevBoxes();
  replay();
  REV._statusText='#'+(idx+1)+' reset \u2014 click canvas to place';
}

function renderRevBoxes(){
  const cont=$('#revBoxes');
  if(!cont) return; // UI is in popup window
  cont.innerHTML='';
  REV.boxes.forEach((b,i)=>{
    const div=document.createElement('div');
    div.className='rev-box'+(i===REV.selIdx?' sel':'')+(b.status==='done'?' done':'');
    const tag=document.createElement('span');tag.className='tag';tag.textContent=i+1;
    const inp=document.createElement('textarea');inp.rows=1;inp.value=b.text;inp.placeholder='Q'+(i+1);
    inp.addEventListener('input',()=>{b.text=inp.value;b.status='ready';autoSave();});
    inp.addEventListener('mousedown',()=>selectRevBox(i));
    inp.addEventListener('keydown',e=>e.stopPropagation());
    const btnR=document.createElement('button');btnR.className='rbtn';btnR.textContent='\u21ba';btnR.title='Reset';
    btnR.onclick=e=>{e.stopPropagation();resetRevBox(i);};
    const btnX=document.createElement('button');btnX.className='rbtn';btnX.textContent='\u00d7';btnX.title='Remove';
    btnX.onclick=e=>{e.stopPropagation();removeRevBox(i);};
    div.appendChild(tag);div.appendChild(inp);div.appendChild(btnR);div.appendChild(btnX);
    cont.appendChild(div);
  });
}
