    $('#speedN').oninput=e=>{op.REV.speed=Math.max(0.1,Math.min(2,+e.target.value));$('#speed').value=Math.round(op.REV.speed*10);};
    $('#autoBtn').onclick=()=>{
      if(op.REV.autoTimer){op.stopRevealAuto();$('#autoBtn').textContent='▶ Auto';}
      else{op.startRevealAuto();$('#autoBtn').textContent='⏸ Stop';}
    };
    // Prompt
    $('#promptBtn').onclick=()=>{op.S.showPrompt=!op.S.showPrompt;$('#promptBtn').classList.toggle('on',op.S.showPrompt);if(op.S.showPrompt){op.S.promptScreenX=null;op.S.promptScreenY=null;}op.replay();};
    $('#bakeBtn').onclick=()=>{op.bakePrompt();};
    $('#pText').oninput=e=>{op.S.promptText=e.target.value;op.replay();op.autoSave();};
    $('#pText').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey)e.preventDefault();e.stopPropagation();});
    $('#pSize').oninput=e=>{op.S.promptSize=Math.max(10,Math.min(60,+e.target.value));op.replay();};
    $('#pLH').oninput=e=>{op.S.promptLH=Math.max(0.8,Math.min(3,+e.target.value));op.replay();};
    $('#pBg').oninput=e=>{op.S.promptBg=e.target.value;op.replay();};
    $('#pFg').oninput=e=>{op.S.promptFg=e.target.value;op.replay();};
    $('#pAlpha').oninput=e=>{op.S.promptAlpha=+e.target.value/100;op.replay();};
    function setAl(a){op.S.promptAlign=a;['alL','alC','alR'].forEach(id=>document.getElementById(id).classList.remove('on'));
      const am={left:'alL',center:'alC',right:'alR'};if(am[a])document.getElementById(am[a]).classList.add('on');op.replay();}
    $('#alL').onclick=()=>setAl('left');$('#alC').onclick=()=>setAl('center');$('#alR').onclick=()=>setAl('right');
    syncFromMain();
    // Poll for updates
    setInterval(()=>{
      const s=$('#status');
      if(op.REV._statusText) s.textContent=op.REV._statusText;
      document.querySelectorAll('.rbox').forEach((el,i)=>el.classList.toggle('sel',i===op.REV.selIdx));
      if(op.REV._autoStopped){op.REV._autoStopped=false;$('#autoBtn').textContent='▶ Auto';}
    },200);
  <\/script></body></html>`);
  d.close();
}
// Expose functions for popup
window.replay=replay;window.autoSave=autoSave;window.pushAn=pushAn;window.setTool=setTool;
window.addRevBox=addRevBox;window.removeRevBox=removeRevBox;window.resetRevBox=resetRevBox;window.selectRevBox=selectRevBox;
window.stopRevealAuto=stopRevealAuto;window.startRevealAuto=startRevealAuto;
window.bakePrompt=function(){
  if(!S.promptText||!S.promptText.trim()) return;
  if(!S._promptBounds) drawPrompt();
  const b=S._promptBounds;
  const x=b?b.x+12:20,y=b?b.y+4:10;
  pushAn({type:'text',runs:[{text:S.promptText,color:S.color,bold:true,italic:false}],x:x,y:y,
    font:S.textFont,fontSize:S.promptSize||20,
    _w:0,_h:0});
  replay();
};
// Status text bridge
REV._statusText='Select a box, click canvas';


function revealStart(x,y){
  if(REV.selIdx<0||REV.selIdx>=REV.boxes.length){REV._statusText='Select a box first';return;}
  const b=REV.boxes[REV.selIdx];
  if(!b.text.trim()){REV._statusText='Box #'+(REV.selIdx+1)+' is empty';return;}
  if(b.status==='done') b.status='ready'; // auto-reset for re-use
  REV.tokens=tokenize(b.text);
  REV.idx=0;REV.x=x;REV.y=y;REV.active=true;
  b.status='active';renderRevBoxes();
  REV._statusText='#'+(REV.selIdx+1)+' | Space = next | 0/'+REV.tokens.length;
  updateRevCursor();
  replay();
}

function revealPrev(){
  if(!REV.active||REV.idx<=0) return;
  REV.idx--;
  drawRevealedText();
  updateRevCursor();
  REV._statusText='#'+(REV.selIdx+1)+' | '+REV.idx+'/'+REV.tokens.length;
}

function revealNext(){
  if(!REV.active||REV.idx>=REV.tokens.length) return;
  REV.idx++;
  drawRevealedText();
  updateRevCursor();
  REV._statusText='#'+(REV.selIdx+1)+' | '+REV.idx+'/'+REV.tokens.length;
  if(REV.idx>=REV.tokens.length){
    const fullText=REV.tokens.slice(0,REV.idx).join('');
    pushAn({type:'text',runs:[{text:fullText,color:S.color,bold:S.textBold,italic:S.textItalic}],x:REV.x,y:REV.y,
      font:S.textFont,fontSize:S.textSize,
      align:S.textAlign,lh:S.textLH,_w:0,_h:0});
    REV.active=false;stopRevealAuto();hideRevCursor();
    REV.boxes[REV.selIdx].status='done';renderRevBoxes();
    // Auto-switch to Select with the new annotation selected
    const newIdx=(S.annotations[S.currentPage]||[]).length-1;
    setTool('select');
    S.selectSet=new Set([newIdx]);
    selectHover=newIdx;
    updateSelectTextBar();
    const next=REV.boxes.findIndex((b,i)=>i>REV.selIdx&&b.status==='ready');
    if(next>=0){REV.selIdx=next;renderRevBoxes();}
    replay();
  }
}

function drawRevealedText(){
  replay();
  if(!REV.active||REV.idx===0) return;
  const partial=REV.tokens.slice(0,REV.idx).join('');
  dX.save();
  dX.globalAlpha=1.0;dX.fillStyle=S.color;
  dX.font=(S.textItalic?'italic ':'')+(S.textBold?'bold ':'')+S.textSize+'px '+S.textFont;
  const maxW=dC.width-REV.x-10;
  const lines=wrapText(dX,partial,maxW>50?maxW:dC.width);
  const lh=S.textSize*(S.textLH||1.25);
  lines.forEach((l,i)=>dX.fillText(l,REV.x,REV.y+(i+1)*lh));
  dX.restore();
}

function updateRevCursor(){
  const rc=$('#revCursor');
  if(!REV.active){rc.style.display='none';return;}
  const r=dC.getBoundingClientRect();
  const scX=r.width/dC.width, scY=r.height/dC.height;
  dX.save();
  dX.font=(S.textItalic?'italic ':'')+(S.textBold?'bold ':'')+S.textSize+'px '+S.textFont;
  const partial=REV.tokens.slice(0,REV.idx).join('');
  const maxW=dC.width-REV.x-10;
  const lines=wrapText(dX,partial,maxW>50?maxW:dC.width);
  const lastLine=lines[lines.length-1]||'';
  const tw=dX.measureText(lastLine).width;
  dX.restore();
  const lh=S.textSize*(S.textLH||1.25);
  const cx=(REV.x+tw)*scX;
  const cy=(REV.y+(lines.length)*lh-S.textSize*0.8)*scY;
  rc.style.display='block';
  rc.style.left=cx+'px';
  rc.style.top=cy+'px';
  rc.querySelector('div').style.height=(S.textSize*scY)+'px';
}

function hideRevCursor(){$('#revCursor').style.display='none';}

function stopRevealAuto(){
  if(REV.autoTimer){clearInterval(REV.autoTimer);REV.autoTimer=null;}
  REV._autoStopped=true;
}
function startRevealAuto(){
  if(!REV.active){REV._statusText='Click on canvas first';return;}
  REV.autoTimer=setInterval(()=>{
    if(REV.idx>=REV.tokens.length){stopRevealAuto();return;}
    revealNext();
  },REV.speed*1000);
}

addRevBox('');

/* ── Present Mode (projector window) ── */
let presWin=null;
$('#btnPresent').onclick=()=>{
  if(window._isIOSApp){
    // iPad: send message to Swift for external display
    window.webkit.messageHandlers.iosHandler.postMessage({action:'present'});
    return;
  }
  if(presWin&&!presWin.closed){presWin.focus();return;}
  presWin=window.open('','LecturePad_Present','width=1024,height=768,left='+screen.width+',top=0');
  if(!presWin){alert('Pop-up blocked. Please allow pop-ups.');return;}
  presWin.document.write(`<!DOCTYPE html><html><head><title>LecturePad</title><style>
    *{margin:0;padding:0}body{background:#000;height:100vh;overflow:hidden;cursor:none}
    canvas{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
  </style></head><body><canvas id="pc"></canvas>
  <script>
    const pc=document.getElementById('pc');const px=pc.getContext('2d');
    function sync(){
      try{
        const op=window.opener;if(!op||op.closed){close();return;}
        const src1=op.document.getElementById('pdfCanvas');
        const src2=op.document.getElementById('drawCanvas');
        const dc=op.document.getElementById('drawCanvas');
        if(!src1||!src2||!dc){requestAnimationFrame(sync);return;}
        const sw=src1.width,sh=src1.height;
        if(sw<=0||sh<=0){requestAnimationFrame(sync);return;}
        // Get visible portion via bounding rects
        const area=op.document.querySelector('.canvas-area');
        if(!area){requestAnimationFrame(sync);return;}
        const aR=area.getBoundingClientRect();
        const dR=dc.getBoundingClientRect();
        const vL=Math.max(aR.left,dR.left)-dR.left;
        const vT=Math.max(aR.top,dR.top)-dR.top;
        const vR=Math.min(aR.right,dR.right)-dR.left;
        const vB=Math.min(aR.bottom,dR.bottom)-dR.top;
        const vW=vR-vL,vH=vB-vT;
        if(vW<=0||vH<=0){requestAnimationFrame(sync);return;}
        const sx=sw/dR.width,sy=sh/dR.height;
        const cx=vL*sx,cy=vT*sy,cw=vW*sx,ch=vH*sy;
        const dpr=window.devicePixelRatio||1;
        const ww=window.innerWidth*dpr,wh=window.innerHeight*dpr;
        const fitScale=Math.min(ww/cw,wh/ch);
        const pw=Math.round(cw*fitScale),ph=Math.round(ch*fitScale);
        if(pc.width!==pw||pc.height!==ph){pc.width=pw;pc.height=ph;}
        px.clearRect(0,0,pw,ph);
        px.drawImage(src1,cx,cy,cw,ch,0,0,pw,ph);
        px.drawImage(src2,cx,cy,cw,ch,0,0,pw,ph);
        // Draw cursor
        const S=op.S;
        if(S&&S.cursorX>=0&&S.cursorY>=0){
          const scx=(S.cursorX-cx)/cw*pw,scy=(S.cursorY-cy)/ch*ph;
          if(scx>=0&&scx<=pw&&scy>=0&&scy<=ph){
            px.save();px.strokeStyle='#3b9eff';px.lineWidth=2;px.globalAlpha=0.7;
            const r=10;
            px.beginPath();px.moveTo(scx-r,scy);px.lineTo(scx+r,scy);px.stroke();
            px.beginPath();px.moveTo(scx,scy-r);px.lineTo(scx,scy+r);px.stroke();
            px.beginPath();px.arc(scx,scy,r,0,Math.PI*2);px.stroke();
            px.restore();
          }
        }
      }catch(e){}
      requestAnimationFrame(sync);
    }
    sync();
    document.addEventListener('keydown',e=>{
      if(e.key==='Escape')close();
      if(e.key==='f'||e.key==='F'){
        if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
        else document.exitFullscreen();
      }
    });
  <\/script></body></html>`);
  presWin.document.close();
};
// Clean up on main window close
window.addEventListener('beforeunload',()=>{if(presWin&&!presWin.closed)presWin.close();if(typeWin&&!typeWin.closed)typeWin.close();});

/* ── Keys ── */
document.addEventListener('keydown',e=>{
  if(e.target===ta||e.target.closest('#ta')||e.target.closest('.rev-box')) return;
  // Space bar continues reveal, Backspace goes back one word
  if(e.key===' '&&REV.active){e.preventDefault();revealNext();return;}
  if(e.key==='Backspace'&&REV.active&&REV.idx>0){e.preventDefault();revealPrev();return;}
  if((e.metaKey||e.ctrlKey)&&e.shiftKey&&e.key==='z'){e.preventDefault();redo();}
  else if((e.metaKey||e.ctrlKey)&&e.key==='z'){e.preventDefault();undo();}
  // Copy
  if((e.metaKey||e.ctrlKey)&&e.key==='c'&&S.tool==='select'&&S.selectSet.size>0){
    e.preventDefault();
    const an=S.annotations[S.currentPage]||[];
    S.clipboard=[];
    S.selectSet.forEach(idx=>{if(an[idx]) S.clipboard.push(JSON.parse(JSON.stringify(an[idx])));});
    return;
  }
  // Paste
  if((e.metaKey||e.ctrlKey)&&e.key==='v'&&S.clipboard.length>0){
    e.preventDefault();
    const pg=S.currentPage;if(!S.annotations[pg]) S.annotations[pg]=[];
    S.selectSet.clear();
    S.clipboard.forEach(a=>{
      const copy=JSON.parse(JSON.stringify(a));
      copy.x=(copy.x||0)+20;copy.y=(copy.y||0)+20; // offset
      if(copy.x1!==undefined){copy.x1+=20;copy.y1+=20;copy.x2+=20;copy.y2+=20;}
      if(copy.points) copy.points=copy.points.map(p=>({x:p.x+20,y:p.y+20}));
      copy.locked=false;
      S.annotations[pg].push(copy);
      S.selectSet.add(S.annotations[pg].length-1);
    });
    setTool('select');
    replay();autoSave();updateSelectTextBar();
    return;
  }
  // Arrow keys: move selected items or navigate pages
  if(e.key.startsWith('Arrow')&&S.tool==='select'&&S.selectSet.size>0){
    e.preventDefault();
    const step=e.shiftKey?10:2;
    const dx=e.key==='ArrowLeft'?-step:e.key==='ArrowRight'?step:0;
    const dy=e.key==='ArrowUp'?-step:e.key==='ArrowDown'?step:0;
    const an=S.annotations[S.currentPage]||[];
    S.selectSet.forEach(idx=>{
      const a=an[idx];if(!a||a.locked)return;
      if(a.type==='text'){a.x+=dx;a.y+=dy;}
      if(a.type==='stroke'){a.points.forEach(p=>{p.x+=dx;p.y+=dy;});}
      if(a.type==='shape'){a.x1+=dx;a.y1+=dy;a.x2+=dx;a.y2+=dy;}
      if(a.type==='image'){a.x+=dx;a.y+=dy;}
    });
    replay();autoSave();
    return;
  }
  // Delete selected items
  if((e.key==='Delete'||e.key==='Backspace')&&S.tool==='select'&&S.selectSet.size>0){
    e.preventDefault();
    const pg=S.currentPage,an=S.annotations[pg]||[];
    S.annotations[pg]=an.filter((_,i)=>!S.selectSet.has(i)||_.locked);
    S.selectSet.clear();selectHover=-1;
    replay();autoSave();
    return;
  }
  if(e.key==='v'||e.key==='V')setTool('select');
  if(e.key==='p'||e.key==='P')setTool('pen');if(e.key==='l'||e.key==='L')setTool('laser');
  if(e.key==='t'&&!e.metaKey&&!e.ctrlKey)setTool('text');
  if(e.key==='r'&&!e.metaKey&&!e.ctrlKey)setTool('reveal');
  if(e.key==='e'||e.key==='E')setTool('eraser');
  if(e.key==='a'&&!e.metaKey&&!e.ctrlKey)setTool('arrow');
  if(e.key==='c'&&!e.metaKey&&!e.ctrlKey)setTool('circle');
  if(e.key==='ArrowLeft')goTo(S.currentPage-1);if(e.key==='ArrowRight')goTo(S.currentPage+1);
});

/* ── Pinch zoom ── */
let pinch={active:false,dist0:0,scale0:1.5};
const cArea=$('.canvas-area');
cArea.addEventListener('scroll',()=>{if(S.showPrompt&&S.promptText) replay();});
cArea.addEventListener('touchstart',e=>{
  if(e.touches.length===2){
    e.preventDefault();pinch.active=true;
    pinch.dist0=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    pinch.scale0=S.zoom;
  }
},{passive:false});
cArea.addEventListener('touchmove',e=>{
  if(pinch.active&&e.touches.length===2){
    e.preventDefault();
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    const ns=Math.max(0.25,Math.min(3,pinch.scale0*(d/pinch.dist0)));
    if(Math.abs(ns-S.zoom)>0.05){S.zoom=ns;updZ();}
  }
},{passive:false});
cArea.addEventListener('touchend',e=>{if(e.touches.length<2) pinch.active=false;});

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
